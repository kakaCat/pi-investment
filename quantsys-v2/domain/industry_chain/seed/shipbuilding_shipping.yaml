# 产业链策展 seed —— 造船·航运链
chain_id: shipbuilding_shipping
name: 造船·航运链
aliases: [造船, 航运, 船舶, 船, 集运, 油运]
curator: investor/w-83e881ec
curated_at: '2026-09-11'
description: 船板钢/船舶配套设备 → 造船总装 → 航运承运 → 港口/贸易终端
rationale: |
  策展依据（人工判断，可质疑）：
  1) 环节切分依据"订单流与利润分配"：船东下单 → 船厂总装 → 船东运营（航运）→ 港口/贸易。
  2) 造船与航运是反向周期（运价高 → 船东赚钱 → 下单造船 → 造船景气），必须分环节看，
     否则会把两个相反驱动混成一条"船舶概念"——这正是只看概念板块会犯的错。
  3) 上游只放船板钢/船舶配套（动力、机电）：它们是船厂成本的直接输入；
     不纳入普钢整体（船板仅是中厚板的一小部分）。
  4) 终端放港口/贸易：吞吐量是贸易需求的落点，可用于验证"运价上行是需求驱动还是运力收缩驱动"。
nodes:
  - node_id: ship_equipment
    name: 船板钢/船舶配套设备
    stage: upstream
    upstream_of: [shipbuilding_yard]
    downstream_of: []
    keywords: [船用, 船舶配套, 柴油机, 动力, 船板, 推进, 低速机]
    rationale: 动力/机电设备约占船舶造价 30-40%，是船厂最大外购项，故列上游。
    members:
      - symbol: '600482'
        name: 中国动力
        role: 龙头
        evidence: 船用低速/中速柴油机与动力系统总成（策展，待主营构成校验）
  - node_id: shipbuilding_yard
    name: 造船总装
    stage: midstream
    upstream_of: [shipping]
    downstream_of: [ship_equipment]
    keywords: [海洋防务装备, 海洋运输装备, 海洋科考装备, 海洋开发装备, 船舶造修, 海洋工程装备, 船舶建造, 造船, 海洋工程, 海工, 舰船, 船舶]
    rationale: 总装厂的在手订单与新船价格是全链最可跟踪的高频指标（订单/价格/成本三要素）。
    members:
      - symbol: '600150'
        name: 中国船舶
        role: 龙头
