  tasks:
    - id: t-180c05
      title: 搭建 qs_plan 包骨架并落五表迁移
      implements: 新建 packages/qs_plan（pyproject.toml + qs_plan/__init__.py + domain/application 目录）；写 infrastructure/persistence/migrations/20261105_trading_plan.py（dry-run 默认/--apply 写库），建 trading_plans / trading_plan_versions / trading_plan_rules / trading_plan_events / plan_reflections 五表 + watch_rules.plan_id + simulation_trades.plan_id/plan_version 两列（IF NOT EXISTS 幂等）。
      serves:
        - FR-1
      depends_on: []
      phase: implement
      side: backend
    - id: t-350b38
      title: 实现五表 ORM 与 TradingPlanRepository
      implements: infrastructure/persistence/orm/models/trading_plan.py 声明五表 ORM；adapters/outbound/repositories/trading_plan_repository.py 实现五表读写（create_plan/record_reflection 等 S-10 方法），含缺列预检降级（沿用 watch_rules 的 information_schema 预检模式）。
      serves:
        - FR-1
      depends_on:
        - t-180c05
      phase: implement
      side: backend
    - id: t-cced59
      title: 实现计划领域模型与状态机守卫
      implements: packages/qs_plan/qs_plan/domain/plan/ 实现 TradingPlan 值对象、退出策略（stop_loss/reduce_plan）、状态机 evaluate_plan_transition 纯函数（draft/active/holding/closing/closed/archived/paused 全部合法边 + 非法边拒绝并给原因）。
      serves:
        - FR-1
      depends_on:
        - t-350b38
      phase: implement
      side: backend
    - id: t-efb315
      title: 实现 PlanService（CRUD/两步提交/纪律门/审计号强制）
      implements: packages/qs_plan/qs_plan/application/plan_service.py：创建/查询/暂停恢复/关闭（有持仓必须给 close_disposition）；PATCH 暂存 draft_spec + 编译预览；apply 版本 CAS（expected_version）+ 纪律门（观察窗锁定、防反复横跳、agent 修改必须 decision_audit_id）+ 单事务写版本行/事件行。
      serves:
        - FR-1
        - FR-6
      depends_on:
        - t-cced59
      phase: implement
      side: backend
    - id: t-dc17c4
      title: 实现 PlanCompiler 幂等编译
      implements: packages/qs_plan/qs_plan/application/plan_compiler.py：spec→watch_rules 的 diff 计算（create/update/retire），幂等键 (plan_id, role, symbol)；写 watch_rules 时带 plan_id/role/position_state（持仓真值）；写 trading_plan_rules 映射与 watch_rule_changes 审计（change_kind=plan_compile）；单事务，失败整批回滚。
      serves:
        - FR-2
      depends_on:
        - t-350b38
      phase: implement
      side: backend
    - id: t-4876f4
      title: 实现计划生命周期路由与编译预览
      implements: adapters/inbound/fastapi_app/routes/plan_async.py 实现 IF-1~IF-9、IF-11（薄壳：参数校验+调 PlanService/PlanCompiler+PLAN_* 错误码映射）；main.py 注册路由。
      serves:
        - FR-1
        - FR-2
        - FR-6
      depends_on:
        - t-efb315
        - t-dc17c4
      phase: implement
      side: backend
    - id: t-dee787
      title: 实现今日计划聚合视图
      implements: packages/qs_plan/qs_plan/application/plan_aggregator.py 组装 today 视图（激活计划/条件就绪度/环境闸 verdict/持仓差额/未决待办）+ plan_async.py IF-10 端点。
      serves:
        - FR-3
      depends_on:
        - t-efb315
      phase: implement
      side: backend
    - id: t-dd0616
      title: 接通成交回执：execute_trade 发 FillEvent + FillSync 推进计划状态
      implements: qs_trading/application/services/account_trading_service.py 成交落库后 emit FillEvent（带 plan_id/plan_version；发送失败只记日志不阻断成交）；qs_watch/fill_sync_service.py on_fill 收敛时经 IPlanProgressPort 回调 PlanService 推进计划状态（清仓→closed、部分成交→对应批次退役）。
      serves:
        - FR-4
      depends_on:
        - t-dc17c4
      phase: implement
      side: backend
    - id: t-60bfe8
      title: 实现计划统计归因与被拦信号统计
      implements: IF-14 计划统计（命中率按版本分组、计划内/外盈亏、执行时延 p50/p95）+ IF-16 watch 侧被拦/抑制触发走势统计（build_blocked_stats，基于既有 outcome 回填表）。
      serves:
        - FR-7
      depends_on:
        - t-dd0616
      phase: implement
      side: backend
    - id: t-d6b85d
      title: 实现反思材料包组装与反思写回
      implements: packages/qs_plan/qs_plan/application/reflection_pack_service.py 组装四输入材料包（计划修改历史/错过机会/盈利/亏损，段级 missing 兜底）；IF-12 反思写回（五问校验、verdict 规则、同周期 version+1）+ IF-13 列表。
      serves:
        - FR-5
        - FR-7
      depends_on:
        - t-efb315
      phase: implement
      side: backend
    - id: t-155457
      title: 实现反思定时任务与 overdue 兜底
      implements: qs_ops 新增调度任务 plan_reflect_daily（盘后 15:35）与 plan_reflect_weekly（周六 10:00）：扫 review_due_at 到期计划→材料包→唤醒 agent→超时计 overdue（连续 3 日告警）；带 TradingDayGuard 守卫。
      serves:
        - FR-5
      depends_on:
        - t-d6b85d
      phase: implement
      side: backend
    - id: t-fd81c5
      title: 实现 trading_plan 工具双端（agent-dh 投资脑 + agent-ts fin-agent）
      implements: agent-dh packages/tools 新增 TradingPlanTool（S-14）+ agent-ts src/infrastructure/tools 新增 trading-plan-tool（S-15）：action 枚举覆盖 IF-1~IF-15；账户取 agents.json 的 instance.account（不写死）；后端 PLAN_* 错误码原样透传；缺账户 AGENT_ACCOUNT_MISSING。
      serves:
        - FR-3
        - FR-5
        - FR-6
      depends_on:
        - t-4876f4
      phase: implement
      side: backend
    - id: t-89fa50
