[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qs-watch"
version = "0.1.0"
description = "PI Investment 实时盯盘包 - WatchEngine 引擎/规则判定/触发通知/回执/降噪自愈"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "structlog",
    # 兄弟二方包（方案卡 docs/plans/package-boundaries-import-linter.md §11.3 白名单）：
    # 本包 import 它们就必须声明——否则离开本工作区 editable 环境即坏。
    "qs-kernel",
    "qs-market-data",
    "qs-notification",
    "qs-trading",
    "qs-ops",
]

[tool.setuptools.packages.find]
include = ["qs_watch*"]
exclude = ["__pycache__*", "*.egg-info*"]
