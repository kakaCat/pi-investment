# 产业链策展 seed —— 半导体链
chain_id: semiconductor
name: 半导体（设计/制造/封测/设备/材料）链
aliases: [半导体, 芯片, 集成电路, 芯片产业链, 半导体链]
curator: investor/w-83e881ec
curated_at: '2026-09-11'
description: 材料 → 设备 → 芯片设计 → 晶圆制造 → 封装测试 → 终端应用
rationale: |
  策展依据（人工判断，可质疑）：
  1) 与既有「半导体芯片产业链核心池」的追踪逻辑一致：设备最赚钱（国产替代）→ AI 芯片弹性最大
     → 制造战略地位 → 封测 Chiplet → 材料国产化洼地；本 seed 把该池的经验结构化为环节拓扑。
  2) 上游拆成 材料 / 设备 两个节点：两者的国产化率与验证周期完全不同
     （材料验证周期更长、客户粘性更强；设备订单弹性更大）。
  3) 中游拆成 设计 / 制造 / 封测 三节点：设计吃 AI 需求弹性、制造吃产能与制程、封测吃先进封装景气，
     混成一个"芯片"节点会让链式扫描失去分辨力（这是主线扫描最容易犯的错）。
  4) 终端只放整机/模组应用，用于判断需求来源（AI 算力 vs 消费电子 vs 汽车）。
nodes:
  - node_id: materials
    name: 半导体材料
    stage: upstream
    upstream_of: [equipment, foundry]
    downstream_of: []
    keywords: [硅片, 光刻胶, 电子特气, 特气产品, 高纯, 抛光, 靶材, 电子材料, 半导体材料, 前驱体]
    rationale: 材料验证周期长、切换成本高，国产化率最低的环节之一（洼地）。
    members:
      - symbol: '688126'
        name: 沪硅产业
        role: 龙头
        evidence: 大硅片（300mm）国产化主力（策展，待主营构成校验）
