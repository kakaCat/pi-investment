# 产业链策展 seed —— 玻璃链（纯碱 → 原片制造 → 深加工 → 终端）
chain_id: glass
name: 玻璃链
aliases: [玻璃, 平板玻璃, 纯碱, 浮法玻璃, 玻璃制造]
curator: investor/w-36c3225e
curated_at: '2026-10-21'
description: 纯碱/石英砂 → 平板玻璃原片 → 玻璃深加工 → 光伏/汽车/建筑终端
rationale: |
  策展依据（人工判断，可质疑）：
  1) 为什么补这条链：2026-10-21 mainline_scan rank1 = 玻璃链 +3.24%（输出 skipped=true 幂等），
     600293 三峡新材 +9.95% 涨停；链内 600176 中国巨石 -0.20%、002080 中材科技 +1.63%、
     601636 旗滨集团 +0.60% 未动。**同一条链内一个涨停、其余不动**——这正是链式扫描
     存在的意义：只看龙头会以为"玻璃没机会"，实际是环节内部分化。
  2) **与已有「玻纤·电子布·PCB链」是两条不同的链，必须分清**：
     那条是"玻纤纱（拉丝）→ 电子布 → 覆铜板 → PCB"，属**电子材料**；
     本条是"纯碱 → 平板玻璃原片（浮法/光伏压延）→ 深加工（钢化/镀膜/中空）→
     建筑/光伏/汽车玻璃终端"，属**传统建材**。两者共同点只是都经过窑炉拉丝。
     混链的后果是：PCB 景气（AI 算力）与玻璃冷修（地产/光伏）会被算成同一件事，
     这是概念板块法的典型错误。
  3) 环节切分依据"窑炉与产能"：纯碱是玻璃的原材料成本（占成本约 30-40%），
     原片是重资产窑炉（连续生产、冷修点火节奏决定供给），深加工赚加工费差。
     **供给侧看冷修/复产节奏，成本侧看纯碱价格**——这两个变量分别落在上游与中游。
  4) 归位口径：主营构成里"玻璃制造加工/玻璃生产及加工/玻璃纤维和玻璃钢"归本链；
     而 600176 中国巨石主营是「玻璃纤维纱及制品 74.8% + 电子纱及电子布 24.3%」
     ⇒ 它归**玻纤·电子布·PCB链**，不属本链的平板玻璃环节。
  5) 终端放光伏/建筑/汽车玻璃：分别对应光伏装机、地产竣工、汽车产量三个独立需求源，
     分开列可判断玻璃需求到底是哪一头在拉动。
nodes:
  - node_id: soda_ash
    name: 纯碱等原材料
    stage: upstream
    upstream_of: [glass_flat]
    downstream_of: []
    keywords: [纯碱, 玻璃原料, 石英砂, 原材料, 无机化工原料]
    rationale: |
      纯碱是平板玻璃最大单项原材料（成本占比约 30-40%），其价格直接决定玻璃毛利；
      玻璃厂对纯碱涨价几乎没有向下游转嫁能力（合同定价滞后 1-2 个月），
      所以纯碱环节与玻璃制造环节的股价方向经常相反——必须分环节。
    members:
      - symbol: '600586'
        name: 金晶科技
        role: 龙头
        evidence: 玻璃与纯碱一体化（策展，待主营构成校验）
  - node_id: glass_flat
    name: 平板玻璃原片制造
    stage: midstream
    upstream_of: [glass_processing]
    downstream_of: [soda_ash]
    keywords: [玻璃制造加工, 玻璃生产及加工, 浮法玻璃, 平板玻璃, 玻璃, 超白光伏玻璃, 玻璃产业, 玻璃制品]
    rationale: |
      原片是重资产窑炉环节：连续生产不可停，冷修/复产与点火节奏决定行业供给，
      是判断"玻璃景气到底是需求拉动还是供给收缩"的决定性环节。
      关键词刻意包含"玻璃"这个宽词，但**同属本链的最长匹配优先**：
      600176 的条目是"玻璃纤维纱及制品"，命中"玻璃纤维纱及制品"（更具体）优先于"玻璃"；
      若一条更具体的节点（如光伏链的"电子玻璃"）同时存在，以更具体者为准。
    members:
      - symbol: '601636'
        name: 旗滨集团
        role: 龙头
        evidence: 浮法玻璃与超白光伏玻璃（策展）
      - symbol: '000012'
        name: 南玻A
        role: 龙头
        evidence: 玻璃产品与电子玻璃（策展）
      - symbol: '600293'
