    keywords: [建筑玻璃, 光伏玻璃, 太阳能玻璃, 汽车玻璃, 幕墙]
    rationale: |
      三个终端对应三个互相独立的需求源：地产竣工、光伏装机、汽车产量。
      终端是需求真伪的落点——列本环节是为了区分"玻璃涨价是供给收缩（周期）还是
      终端需求真实回暖（成长）"。
    members:
      - symbol: '002623'
