  - node_id: glass_processing
    name: 玻璃深加工
    stage: downstream
    upstream_of: [glass_terminal]
    downstream_of: [glass_flat]
    keywords: [钢化, 镀膜, 中空, 夹层, 玻璃深加工, 真空玻璃, 节能玻璃]
    rationale: |
      深加工赚的是加工费差（相对原片有溢价），是玻璃产业里唯一能稳定跑赢原片周期的环节；
      同时它的产能扩张门槛低于窑炉，抗周期能力更强。
    members:
      - symbol: '600819'
