curator: investor/w-36c3225e
curated_at: '2026-10-21'
description: 原材料/汽车零部件 → 整车制造 → 销售与服务终端
rationale: |
  策展依据（人工判断，可质疑）：
  1) 为什么补这条链：2026-10-19 汽车零部件板块 6 只涨停（603197/002085/600178/600148/
     603348/600686），是当日最强涨停集群，但本库 8 条产业链无汽车链 ⇒ 原则#4 链式扫描
     铁律在真实主线面前是漏的。2026-10-21 002085 又以计划内标的身份 +3.90% 领涨。
  2) 环节切分依据"订单流与利润分配"：零部件厂 → 整车厂 → 销售/服务终端。
     整车厂是订单的分配者与定价权持有者（对上游压价、对下游提价），
     因此车市景气（销量/出口/价格战）先反映在整车厂的产销与库存，再传导到零部件排产。
  3) **必须与"汽车概念"分开**：002085 万丰奥威主营构成是「汽车零部件 85.2% + 飞机制造 14.8%」，
     600104 东风是「整车 63.5% + 零部件 31.4%」——同一家公司可以同时在两个环节，
     故环节归位必须靠主营构成占比（evidence_kind=主营构成），不能靠概念板块归属。
     这正是只看概念板块会犯的错（与造船链"造船 vs 航运反向周期"同类问题）。
  4) 上游只收"汽车零部件制造"这一类硬制造（发动机/变速器/车身/铸件/齿轮/玻璃），
     不收锂电/半导体（另属锂电链、半导体链，避免跨链重复计数）。
  5) 终端放销售与服务：经销商/汽车服务是零售需求的落点，可用于验证"销量上行是真实需求
     还是渠道压库"。
