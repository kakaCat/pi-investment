# 产业链策展 seed —— 养殖链（饲料 → 生猪/禽类养殖 → 屠宰加工）
chain_id: livestock_farming
name: 养殖链
aliases: [养殖, 生猪, 禽类, 饲料, 白羽鸡, 猪链]
curator: investor/w-36c3225e
curated_at: '2026-10-21'
description: 饲料/动保 → 生猪与禽类养殖 → 屠宰与肉制品加工
rationale: |
  策展依据（人工判断，可质疑）：
  1) 为什么补这条链：2026-10-21 养殖业主力资金净额 +11.59 亿居板块资金流 TOP1
     （fund_flow 13:45），农林牧渔当日 +2.69% 居涨幅首位，链内 001201 东瑞 +9.99% 涨停、
     002696 百洋 +10.04% 涨停、300498 温氏 +3.73%、002714 牧原 +3.04%。
     本库 8 条链无养殖链 ⇒ 10-21 全天最真实的资金主线在扫描上是盲区。
  2) 环节切分依据"成本传导与利润分配"：饲料/动保（成本端）→ 养殖（产能与出栏）→
     屠宰加工（品牌与零售价差）。猪价/鸡价是这一链的**共同定价变量**，
     但传导时滞不同：饲料涨价 1~2 个月才到猪价，屠宰端看的是终端消费。
  3) **必须把"饲料"和"养殖"分开**：同一家公司常常两头都在——
     002696 百洋是「饲料 51.8% + 食品加工 38.2%」、002385 大北农是「饲料动保 68.9% + 生猪养殖 21.7%」、
     603477 巨星农牧是「农牧 96.9%（生猪 90.4% + 饲料 6.1%）」。
     不分环节就会把"饲料涨价受益"（上游）与"猪价上涨受损"（中游）混成一条"农业概念"，
     这是本链最核心的误判风险。
  4) 上游只收饲料与兽药动保；不收种业/宠物食品（属独立主题，不在本链口径内）。
  5) 终端放屠宰与肉制品：它是**消费需求的落点**——用来验证猪价上行是供给收缩（周期）还是
     真实消费回暖（需求），这两者对后续判断完全不同。
