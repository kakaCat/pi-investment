    name: 饲料与兽药动保
    stage: upstream
    upstream_of: [livestock_farming]
    downstream_of: []
    keywords: [饲料, 兽药, 动保, 饲料动保, 饲料加工, 兽用原料药, 饲料加工业, 饲料工业]
    rationale: |
      饲料与动保是养殖的成本端：玉米豆粕价格下行 → 饲料毛利改善 → 养殖成本下降。
      注意这一环的股价驱动与中游相反（猪价跌时养殖受损、饲料端成本受益），
      必须分环节看，否则无法解释同一板块内的涨跌分化。
    members:
