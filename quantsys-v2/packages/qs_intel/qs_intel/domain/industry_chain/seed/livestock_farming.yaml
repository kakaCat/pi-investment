      高频跟踪指标是能繁母猪存栏、出栏均价与出栏量。
      关键词把"养殖/生猪/鸡/猪"等口语化词与"养殖行业/肉鸡养殖/畜牧业"等披露口径并列，
      因为不同公司披露名不一致（温氏=养殖行业，牧原=养殖，巨星=农牧业务）。
