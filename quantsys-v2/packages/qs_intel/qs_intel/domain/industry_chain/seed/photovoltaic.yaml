        name: 阳光电源
        role: 龙头
        evidence: 逆变器全球份额前列+储能（策展，待主营构成校验）
      - symbol: '603806'
        name: 福斯特
        role: 龙头
        evidence: 光伏胶膜全球份额第一（策展）
      - symbol: '601865'
