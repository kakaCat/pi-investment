# Ruff 配置文件
# 用于代码质量检查和自动格式化

# 每行最大长度（顶层选项，不属于 [lint]）
line-length = 120

# Python 版本（顶层选项，不属于 [lint]）
target-version = "py310"

[lint]
# 启用的规则集
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "T201",  # 禁止 print()
    "BLE",   # 禁止裸 except（blind-except）
]

# 忽略的规则
ignore = [
    "E501",  # 行长度检查（由 Black 处理）
    "B008",  # 函数调用参数默认值
]

[lint.per-file-ignores]
# 允许以下文件使用 print() 和裸 except
"scripts/*" = ["T201", "BLE001"]
"tools/*" = ["T201", "BLE001"]
"debug_*.py" = ["T201", "BLE001"]
"diagnose_*.py" = ["T201", "BLE001"]
"examples/*" = ["T201", "BLE001"]
"tests/*" = ["T201", "BLE001"]
"archived_scripts/*" = ["T201", "BLE001"]
"live_trading/*" = ["T201", "BLE001"]
"domain/benchmarks/*" = ["T201", "BLE001"]
"examples.py" = ["T201", "BLE001"]
# 仓库根目录的可运行/验证脚本（非 prod 模块，保留 print 输出）
"conftest.py" = ["T201", "BLE001"]
"load_env.py" = ["T201", "BLE001"]
"verify_p2_3_integration.py" = ["T201", "BLE001"]
"detailed_api_comparison.py" = ["T201", "BLE001"]
"fix_*.py" = ["T201", "BLE001"]
"test_*.py" = ["T201", "BLE001"]

# 旧代码临时豁免（迁移完成后删除）
"domain/quantlib/*" = ["BLE001"]
"adapters/inbound/api/*" = ["BLE001"]  # Flask 旧代码，待删除

[lint.isort]
known-first-party = ["domain", "application", "adapters", "infrastructure"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.flake8-bugbear]
# 允许的可变默认参数类型
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[format]
# 使用双引号
quote-style = "double"

# 缩进
indent-style = "space"

# 行尾
line-ending = "auto"

# 魔法尾随逗号
skip-magic-trailing-comma = false

# 文档字符串代码格式化
docstring-code-format = true
