<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantSys V2 WebSocket 测试客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status.connected {
            background: #10b981;
        }

        .status.disconnected {
            background: #ef4444;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .panel {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1f2937;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #4b5563;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .messages {
            grid-column: 1 / -1;
            background: #1f2937;
            color: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            background: #374151;
        }

        .message.quote {
            border-left: 3px solid #3b82f6;
        }

        .message.signal {
            border-left: 3px solid #10b981;
        }

        .message.risk {
            border-left: 3px solid #ef4444;
        }

        .message.system {
            border-left: 3px solid #6b7280;
        }

        .timestamp {
            color: #9ca3af;
            font-size: 11px;
        }

        .subscriptions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .subscription-tag {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subscription-tag .remove {
            cursor: pointer;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QuantSys V2 WebSocket 测试客户端</h1>
            <div class="status disconnected" id="status">未连接</div>
        </div>

        <div class="content">
            <div class="panel">
                <h2>连接控制</h2>
                <div class="input-group">
                    <label>服务器地址</label>
                    <input type="text" id="serverUrl" value="http://127.0.0.1:5000" placeholder="http://127.0.0.1:5000">
                </div>
                <button class="btn btn-primary" id="connectBtn" onclick="connect()">连接</button>
                <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="messageCount">0</div>
                        <div class="stat-label">消息数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="quoteCount">0</div>
                        <div class="stat-label">行情</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="signalCount">0</div>
                        <div class="stat-label">信号</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>订阅管理</h2>
                <div class="input-group">
                    <label>股票代码</label>
                    <input type="text" id="symbolInput" placeholder="例如: 000001.SZ" onkeypress="if(event.key==='Enter') subscribe()">
                </div>
                <button class="btn btn-success" onclick="subscribe()">订阅</button>
                <button class="btn btn-primary" onclick="getSubscriptions()">刷新列表</button>

                <div class="subscriptions" id="subscriptions"></div>
            </div>

            <div class="panel">
                <h2>测试事件</h2>
                <div class="input-group">
                    <label>股票代码</label>
                    <input type="text" id="testSymbol" placeholder="000001.SZ">
                </div>
                <div class="input-group">
                    <label>价格</label>
                    <input type="number" id="testPrice" placeholder="10.50" step="0.01">
                </div>
                <button class="btn btn-primary" onclick="testQuote()">发送行情</button>
                <button class="btn btn-success" onclick="testSignal()">发送信号</button>
                <button class="btn btn-danger" onclick="testRisk()">发送风险</button>
            </div>

            <div class="panel">
                <h2>心跳测试</h2>
                <button class="btn btn-primary" onclick="sendPing()">发送 Ping</button>
                <button class="btn btn-danger" onclick="clearMessages()">清空消息</button>
                <div style="margin-top: 15px;">
                    <label>
                        <input type="checkbox" id="autoScroll" checked>
                        自动滚动
                    </label>
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="message system">
                    <div class="timestamp">系统</div>
                    <div>等待连接...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = null;
        let messageCount = 0;
        let quoteCount = 0;
        let signalCount = 0;

        function connect() {
            const url = document.getElementById('serverUrl').value;
            socket = io(url);

            socket.on('connect', () => {
                updateStatus(true);
                addMessage('system', '已连接到服务器');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            });

            socket.on('disconnect', () => {
                updateStatus(false);
                addMessage('system', '已断开连接');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            });

            socket.on('connected', (data) => {
                addMessage('system', `连接成功: ${data.message}`);
            });

            socket.on('message', (data) => {
                handleMessage(data);
            });

            socket.on('broadcast', (data) => {
                addMessage('system', `全局广播: ${JSON.stringify(data)}`);
            });

            socket.on('subscribed', (data) => {
                addMessage('system', `订阅成功: ${data.symbol}`);
                getSubscriptions();
            });

            socket.on('unsubscribed', (data) => {
                addMessage('system', `取消订阅: ${data.symbol}`);
                getSubscriptions();
            });

            socket.on('subscriptions', (data) => {
                updateSubscriptions(data.symbols);
            });

            socket.on('pong', (data) => {
                addMessage('system', `Pong 收到: ${data.timestamp}`);
            });

            socket.on('error', (data) => {
                addMessage('system', `错误: ${data.message}`);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        function subscribe() {
            const symbol = document.getElementById('symbolInput').value.trim();
            if (!symbol) {
                alert('请输入股票代码');
                return;
            }
            if (socket && socket.connected) {
                socket.emit('subscribe', { symbol });
                document.getElementById('symbolInput').value = '';
            } else {
                alert('请先连接服务器');
            }
        }

        function unsubscribe(symbol) {
            if (socket && socket.connected) {
                socket.emit('unsubscribe', { symbol });
            }
        }

        function getSubscriptions() {
            if (socket && socket.connected) {
                socket.emit('get_subscriptions');
            }
        }

        function sendPing() {
            if (socket && socket.connected) {
                socket.emit('ping');
            } else {
                alert('请先连接服务器');
            }
        }

        function testQuote() {
            const symbol = document.getElementById('testSymbol').value.trim();
            const price = parseFloat(document.getElementById('testPrice').value);

            if (!symbol || !price) {
                alert('请输入股票代码和价格');
                return;
            }

            fetch(`${document.getElementById('serverUrl').value}/api/ws/test/publish_quote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol, price, volume: 1000000 })
            }).then(r => r.json()).then(data => {
                addMessage('system', `测试行情已发送: ${data.message}`);
            }).catch(err => {
                addMessage('system', `发送失败: ${err.message}`);
            });
        }

        function testSignal() {
            const symbol = document.getElementById('testSymbol').value.trim();
            if (!symbol) {
                alert('请输入股票代码');
                return;
            }

            fetch(`${document.getElementById('serverUrl').value}/api/ws/test/publish_signal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    symbol,
                    signal: 'buy',
                    strategy: 'test_strategy',
                    confidence: 0.85
                })
            }).then(r => r.json()).then(data => {
                addMessage('system', `测试信号已发送: ${data.message}`);
            }).catch(err => {
                addMessage('system', `发送失败: ${err.message}`);
            });
        }

        function testRisk() {
            const symbol = document.getElementById('testSymbol').value.trim();
            if (!symbol) {
                alert('请输入股票代码');
                return;
            }

            fetch(`${document.getElementById('serverUrl').value}/api/ws/test/publish_risk`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    symbol,
                    risk_type: 'concentration',
                    level: 'high',
                    message: '仓位集中度过高'
                })
            }).then(r => r.json()).then(data => {
                addMessage('system', `测试风险已发送: ${data.message}`);
            }).catch(err => {
                addMessage('system', `发送失败: ${err.message}`);
            });
        }

        function handleMessage(data) {
            const type = data.type;
            let content = '';

            if (type === 'quote') {
                quoteCount++;
                content = `${data.symbol} 价格: ${data.price} 成交量: ${data.volume}`;
                document.getElementById('quoteCount').textContent = quoteCount;
            } else if (type === 'signal') {
                signalCount++;
                content = `${data.symbol} 信号: ${data.signal} 置信度: ${data.confidence} 策略: ${data.strategy}`;
                document.getElementById('signalCount').textContent = signalCount;
            } else if (type === 'risk_alert') {
                content = `${data.symbol} 风险: ${data.risk_type} 级别: ${data.level} - ${data.message}`;
            } else {
                content = JSON.stringify(data);
            }

            addMessage(type, content, data.timestamp);
        }

        function addMessage(type, content, timestamp) {
            messageCount++;
            document.getElementById('messageCount').textContent = messageCount;

            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const ts = timestamp || new Date().toISOString();
            messageDiv.innerHTML = `
                <div class="timestamp">${new Date(ts).toLocaleTimeString()}</div>
                <div>${content}</div>
            `;

            messagesDiv.appendChild(messageDiv);

            if (document.getElementById('autoScroll').checked) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.textContent = '已连接';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = '未连接';
                statusDiv.className = 'status disconnected';
            }
        }

        function updateSubscriptions(symbols) {
            const subsDiv = document.getElementById('subscriptions');
            subsDiv.innerHTML = '';

            symbols.forEach(symbol => {
                const tag = document.createElement('div');
                tag.className = 'subscription-tag';
                tag.innerHTML = `
                    ${symbol}
                    <span class="remove" onclick="unsubscribe('${symbol}')">×</span>
                `;
                subsDiv.appendChild(tag);
            });
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
            quoteCount = 0;
            signalCount = 0;
            document.getElementById('messageCount').textContent = '0';
            document.getElementById('quoteCount').textContent = '0';
            document.getElementById('signalCount').textContent = '0';
        }
    </script>
</body>
</html>
