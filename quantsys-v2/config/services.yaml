version: '1.0'
description: 'QuantSys-v2 服务配置 - 基础配置'

# Repository 层
repositories:
  # 股票相关
  stock:
    interface: qs_kernel.domain.ports.IStockRepository
    implementation: adapters.outbound.repositories.StockORMRepository
    lifecycle: singleton
    description: '股票基础数据仓库'

  kline:
    interface: qs_kernel.domain.ports.IKlineRepository
    implementation: adapters.outbound.repositories.KlineORMRepository
    lifecycle: singleton
    description: 'K线数据仓库'

  # 热力图聚合仓储（2026-10-21 S11 僵尸测试批次2：生产 DI 收口——该端口此前从未注册，
  # 测试靠根 conftest _make_safe 幻肢吞 ValueError 塞 MagicMock，9F 根因）
  heatmap:
    interface: qs_kernel.domain.ports.IHeatmapRepository
    implementation: adapters.outbound.repositories.heatmap_repository.HeatmapRepository
    lifecycle: singleton
    description: '热力图聚合仓储'

  # ── 2026-10-21 反向越层阶段1：watch 族出向（qs_watch 经 _repo_resolver 消费）──
  watch_rule:
    interface: qs_watch.domain.watch.ports.IWatchRuleRepository
    implementation: adapters.outbound.repositories.watch_rule_repository.WatchRuleRepository
    lifecycle: transient
    description: '盯盘规则仓储'
  watch_trigger:
    interface: qs_watch.domain.watch.ports.IWatchTriggerRepository
    implementation: adapters.outbound.repositories.watch_rule_repository.WatchTriggerRepository
    lifecycle: transient
    description: '盯盘触发记录仓储'
  watch_digest_state:
    interface: qs_watch.domain.watch.ports.IWatchDigestStateRepository
    implementation: adapters.outbound.repositories.watch_state_repository.WatchDigestStateRepository
    lifecycle: transient
    description: '盯盘摘要状态仓储'
  watch_intervention:
    interface: qs_watch.domain.watch.ports.IWatchInterventionRepository
    implementation: adapters.outbound.repositories.watch_state_repository.WatchInterventionRepository
    lifecycle: transient
    description: '盯盘人工干预留痕仓储'
  watch_outcome:
    interface: qs_watch.domain.watch.ports.IWatchOutcomeRepository
    implementation: adapters.outbound.repositories.watch_outcome_repository.WatchOutcomeRepository
    lifecycle: transient
    description: '盯盘结果仓储'
  simulation_position:
    interface: qs_watch.domain.watch.ports.ISimulationPositionRepository
    implementation: adapters.outbound.repositories.simulation_position_repository.SimulationPositionRepository
    lifecycle: transient
    description: '模拟盯盘持仓仓储'
  watch_pool_binding:
    interface: qs_watch.domain.watch.ports.IWatchPoolBindingRepository
    implementation: adapters.outbound.repositories.watch_pool_binding_repository.WatchPoolBindingRepository
    lifecycle: transient
    description: '盯盘池绑定仓储'
  pool_member_source:
    interface: qs_watch.domain.watch.ports.IPoolMemberSource
    implementation: adapters.outbound.repositories.watch_pool_binding_repository.PoolMemberSource
    lifecycle: transient
    description: '池成员只读来源'
  news_source:
    interface: qs_watch.domain.watch.ports.INewsSource
    implementation: adapters.outbound.repositories.watch_news_repository.WatchNewsSource
    lifecycle: transient
    description: '盯盘新闻来源'
  news_alert:
    interface: qs_watch.domain.watch.ports.IWatchNewsAlertRepository
    implementation: adapters.outbound.repositories.watch_news_repository.NewsAlertRepository
    lifecycle: transient
    description: '盯盘新闻告警留痕仓储'
  watch_runtime_state:
    interface: qs_watch.domain.watch.ports.IWatchRuntimeStateStore
    implementation: adapters.outbound.repositories.watch_runtime_state_repository.WatchRuntimeStateRepository
    lifecycle: transient
    description: '盯盘运行态持久化（IWatchRuntimeStateStore 实现）'
  watch_todo:
    interface: qs_watch.domain.watch.ports.IWatchTodoRepository
    implementation: adapters.outbound.repositories.watch_todo_repository.WatchTodoRepository
    lifecycle: transient
    description: '盯盘待办仓储'
  watch_receipt:
    interface: qs_watch.domain.watch.ports.IWatchReceiptRepository
    implementation: adapters.outbound.repositories.watch_receipt_repository.WatchReceiptRepository
    lifecycle: transient
    description: '盯盘回执仓储'
  watch_rule_change:
    interface: qs_watch.domain.watch.ports.IWatchRuleChangeRepository
    implementation: adapters.outbound.repositories.watch_rule_change_repository.WatchRuleChangeRepository
    lifecycle: transient
    description: '盯盘规则变更审计仓储'
  watch_rule_noise:
    interface: qs_watch.domain.watch.ports.IWatchRuleNoiseRepository
    implementation: adapters.outbound.repositories.watch_rule_noise_repository.WatchRuleNoiseRepository
    lifecycle: transient
    description: '盯盘规则抑噪仓储'
  stock_name_resolver:
    interface: qs_watch.domain.watch.ports.IStockNameResolver
    implementation: adapters.outbound.repositories.stock_name_resolver.PgStockNameResolver
    lifecycle: transient
    description: '标的名批量解析'

  # 交易信号相关
  signal:
    interface: qs_kernel.domain.ports.ISignalRepository
    implementation: adapters.outbound.repositories.SignalORMRepository
    lifecycle: singleton
    description: '交易信号仓库'

  signal_execution:
    interface: qs_kernel.domain.ports.ISignalExecutionRepository
    implementation: adapters.outbound.repositories.SignalExecutionORMRepository
    lifecycle: singleton
    description: '信号执行记录仓库'

  signal_execution_log:
    interface: qs_kernel.domain.ports.ISignalExecutionLogRepository
    implementation: adapters.outbound.repositories.SignalExecutionLogORMRepository
    lifecycle: singleton
    description: '信号执行日志仓库'

  # 股票池相关
  stock_pool:
    interface: qs_kernel.domain.ports.IStockPoolRepository
    implementation: adapters.outbound.repositories.StockPoolORMRepository
    lifecycle: singleton
    description: '股票池仓库'

  # 策略和回测相关
  strategy:
    interface: qs_kernel.domain.ports.IStrategyRepository
    implementation: adapters.outbound.repositories.StrategyORMRepository
    lifecycle: singleton
    description: '策略仓库'

  backtest:
    interface: qs_kernel.domain.ports.IBacktestRepository
    implementation: adapters.outbound.repositories.BacktestORMRepository
    lifecycle: singleton
    description: '回测仓库'

  # 模拟交易相关
  simulation:
    interface: qs_kernel.domain.ports.ISimulationRepository
    implementation: adapters.outbound.repositories.SimulationORMRepository
    lifecycle: singleton
    description: '模拟交易仓库'

  portfolio:
    interface: qs_kernel.domain.ports.IPortfolioRepository
    implementation: adapters.outbound.repositories.PortfolioORMRepository
    lifecycle: singleton
    description: '投资组合仓库'

  # 因子和风险相关
  factor:
    interface: qs_kernel.domain.ports.IFactorRepository
    implementation: adapters.outbound.repositories.FactorORMRepository
    lifecycle: singleton
    description: '因子数据仓库'

  risk:
    interface: qs_kernel.domain.ports.IRiskRepository
    implementation: adapters.outbound.repositories.RiskORMRepository
    lifecycle: singleton
    description: '风险数据仓库'

  # 资金流 / 博弈情报（2026-09-10 补注册，w-23c70356）
  # 缺失导致 GameAlertService→OpponentBehaviorService 构造时
  # EnhancedServiceFactory.resolve(IFundFlowRepository) 抛 "Service not registered"，
  # /api/alerts/check 返回 500、market_alert 工具不可用
  fund_flow:
    interface: qs_kernel.domain.ports.IFundFlowRepository
    implementation: adapters.outbound.repositories.FundFlowORMRepository
    lifecycle: singleton
    description: '个股资金流仓库（quant.stock_fund_flow，金额单位万元）'

# Application 服务层
services:
  # 缠论相关
  chan_service:
    class: application.services.chan_service.ChanService
    lifecycle: singleton
    dependencies:
      kline_repo: repositories.kline
    description: '缠论分析服务'

  chan_scan_service:
    class: application.services.chan_scan_service.ChanScanService
    lifecycle: singleton
    dependencies:
      chan_service: chan_service
      pool_repo: repositories.stock_pool
      signal_repo: repositories.signal
    description: '缠论扫描服务'

  # 股票代码验证
  stock_code_validator:
    class: application.services.stock_code_validator.StockCodeValidator
    lifecycle: singleton
    dependencies:
      kline_repo: repositories.kline
    description: '股票代码验证服务'

  # 筹码分布
  # 盯盘引擎（TODO: 未实现，暂时禁用）
  # watch_engine:
  #   class: application.services.watch_engine.WatchEngine
  #   lifecycle: singleton
  #   factory: infrastructure.factories.create_watch_engine
  #   description: '实时盯盘引擎'

  # 策略服务
  strategy_code_service:
    class: application.services.strategy_code_service.StrategyCodeService
    lifecycle: singleton
    dependencies:
      # 2026-08-25 修复：移除 data_service 依赖（StrategyCodeService.__init__ 根本不接收它，
      # 且 create_data_service 工厂链会回调 get_strategy_code_service 形成循环依赖：
      # StrategyCodeService -> data_service -> ... -> StrategyCodeService，回测全挂）。
      # 补上实际接收的 kline_repo。
      strategy_repo: repositories.strategy
      kline_repo: repositories.kline
    description: '策略代码执行服务'

  # 风险检查
  risk_check_service:
    class: application.services.risk_check_service.RiskCheckService
    lifecycle: singleton
    description: '风险检查服务'

  # 财务数据（已迁移到适配器）
  financial_data_service:
    class: application.services.financial_data_service_adapter.FinancialDataServiceAdapter
    lifecycle: singleton
    description: '财务数据服务（包装 DataProviderManager）'

  # 财务数据适配器（新架构）
  financial_data_service_adapter:
    class: application.services.financial_data_service_adapter.FinancialDataServiceAdapter
    lifecycle: singleton
    description: '财务数据服务适配器（包装 DataProviderManager）'

  # 信号执行调度器
  signal_execution_scheduler:
    class: application.services.signal_execution_scheduler.SignalExecutionScheduler
    lifecycle: singleton
    factory: infrastructure.factories.create_signal_execution_scheduler
    description: '信号执行调度器'


  # 摆动点分析
  swing_point_service:
    class: application.services.swing_point_service.SwingPointService
    lifecycle: singleton
    dependencies:
      kline_repo: repositories.kline
      validator: stock_code_validator
    description: '摆动点分析服务'

# 默认环境配置
environments:
  dev:
    services:
      watch_engine:
        config:
          check_interval: 60  # 开发环境检查间隔（秒）

  test:
    # 测试环境使用 Mock 仓库
    repositories:
      stock:
        implementation: tests.mocks.MockStockRepository
      kline:
        implementation: tests.mocks.MockKlineRepository

  prod:
    services:
      watch_engine:
        config:
          check_interval: 30  # 生产环境检查间隔（秒）
