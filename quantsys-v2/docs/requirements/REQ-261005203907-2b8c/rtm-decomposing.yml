      implements: "新建 adapters/inbound/fastapi_app/daily_jobs/gate.py：skip_non_trading_day(now=None)->tuple[bool,dict] / is_non_trading_day(now=None)->bool / verdict_info(now=None)->dict；判据 skip = (not TradingDayGuard.check(now).is_trading_day) and (not verdict.degraded)；永不抛，自身异常返回 (False, {'source':'gate-error',...}) 并记 warning 日志；注解五键 day/is_trading_day/source/degraded/reason。改 adapters/inbound/fastapi_app/daily_jobs/defs.py：JobDef 末尾追加 trading_days_only: bool = False（必须末位带默认值，仓内多处按位置参数构造）。新增 tests/test_daily_jobs_trading_day_gate.py 覆盖 TC-1 真值表：休市日 2026-10-05/06/07 → skip=True；交易日 2026-09-30/2026-10-08 → skip=False；周末 2026-10-03 → skip=True；degraded=True → skip=False（fail-open）；check 抛异常 → skip=False 且 source='gate-error'；注解形状五键齐。打桩点 daily_jobs.gate.TradingDayGuard，零网络零 DB。不改 daily_jobs/__init__.py 与 daily_jobs_bootstrap.py 的导出清单。"
      serves:
        - FR-1
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-075116
      title: 宿主接线：_run_job 跳过早退 + 3 任务置位
      implements: "改 adapters/inbound/fastapi_app/daily_jobs/runtime.py：_run_job 在 _mark_running 之后、_send_feishu('▶️ 每日任务开始…') 之前插入早退分支——if job.trading_days_only and skip_non_trading_day()[0]: 写 _mark_done(status='skipped', result={'skipped':True,'reason':f'非交易日（{day}）：{reason}','trading_day':info}) + scheduler_job_runs_total.labels(status='skipped').inc() + logger.info('inprocess_job_skipped') + return（不发任何飞书、不观测 duration）；照跑路径在 result 为 dict 时补 result['trading_day']=info，degraded=True 时记 logger.warning('inprocess_job_trading_day_degraded')。改 adapters/inbound/fastapi_app/daily_jobs/registry.py：pool_daily_refresh / chip_distribution / evolution_fitness 三行加 trading_days_only=True；evening_pipeline 与其余 5 个任务不加。在 tests/test_daily_jobs_trading_day_gate.py 追加：跳过留痕（_mark_done 收到 status='skipped' 且 result['skipped'] is True 且 trading_day 五键齐）、_send_feishu 调用次数为 0、handler 未被调用（side_effect=AssertionError）、注册表里 trading_days_only=True 的集合恰好是那 3 个。打桩点必须是 daily_jobs.runtime 模块内的 _mark_running/_mark_done/_send_feishu（打在 alerting 或 daily_jobs_bootstrap 上会静默失效并真发飞书）。"
      serves:
        - FR-1
        - FR-3
        - FR-5
      depends_on:
        - t-dd0d4d
      phase: implement
      side: backend
    - id: t-588729
      title: 晚间管线：因子段局部跳过（K 线段原样）
      implements: "改 adapters/inbound/fastapi_app/daily_jobs/pipeline.py 的 _job_evening_pipeline：入口取一次 non_trading = is_non_trading_day()；K 线段（探活、覆盖度门槛、批大小、缺口修复、失败上抛）逐字不动；因子段改为 kline=results.get('kline_sync') or {}; kline_changed = kline.get('status') != 'skipped' and (kline.get('success') or 0) > 0; if non_trading and not kline_changed and kline.get('status') != 'error': results['factor_compute']={'status':'skipped','skipped':True,'reason':f'非交易日（{expected} 基准）且 K 线本次无更新'} else: results['factor_compute']=handle_factor_compute({'max_symbols':6000})。新增 tests/test_evening_pipeline_holiday_gate.py 覆盖 TC-4 六行真值表：休市日+K线skipped→因子不跑；休市日+K线success且success=137→因子跑；休市日+success=0→因子不跑；休市日+status='error'→因子跑且随后仍 raise；交易日+K线skipped→因子必须跑（防交易日漏算因子）；跳过形态经 find_result_failure 判为非失败。打桩点：daily_jobs.pipeline 的 is_non_trading_day/_kline_coverage/_probe_kline_sources，以及源头模块 application.services.scheduler_tasks.handle_factor_compute 与 infrastructure.jobs.kline_update_job.update_gem_klines（函数内局部 import）。"
      serves:
        - FR-4
      depends_on:
        - t-dd0d4d
      phase: implement
      side: backend
