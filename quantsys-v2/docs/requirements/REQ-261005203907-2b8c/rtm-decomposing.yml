      title: 兼容与回滚核验（零 DDL / 既有消费者行为）
      implements: 在 tests/test_daily_jobs_trading_day_gate.py 追加兼容判据用例：is_due(job, now, {'status':'skipped','started_at':now}) is False；catchup_due(job, now, has_recent_failure=True) 在排班日 is False；trigger_job 对 skipped 行不返回『今日已有记录』拒绝；find_result_failure({'skipped':True,...}) is None；find_result_failure({'kline_sync':{'status':'success','skipped':12}}) 不因 int 误判（is True 严格布尔）。写 docs/requirements/REQ-261005203907-2b8c/notes/compat-rollback.md：记录 git diff --name-only 中不含 infrastructure/persistence/migrations/** 的核验输出、status 列 text 无 CHECK 约束的核验、以及回滚步骤（撤 3 处 trading_days_only=True 与 pipeline 因子段判定，已产生的 skipped 行无需清理）。
