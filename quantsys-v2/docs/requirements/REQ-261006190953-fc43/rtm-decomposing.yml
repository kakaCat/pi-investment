      implements: 新建 application/services/nav_series.py，导出四个函数（签名见 design/interfaces.md §2）：trading_day_set(exchange='ALL', force_refresh=False) 读 TradingCalendarORMRepository.list_trading_days 并做进程内 TTL 缓存，读失败/空表返回 None（绝不用空集表达失败）；filter_trading_days(rows, trading_days=None, date_of=...)，None 时原样返回；nav_returns_from_snapshots(snapshots, trading_days=None) 先丢 total_value<=0 行、再按交易日过滤、再相邻配对算收益，返回 (returns, points)；nav_coverage(snapshots, trading_days=None, max_listed=20) 返回 verified/points/from/to/missing_trading_days/missing_count/basis/trading_day_source。把 application/services/risk_metrics_service.py 里的 nav_returns_from_snapshots 改为转发 shim（保持既有导入路径可用，函数体与注释指向 nav_series）。新增 tests/test_nav_series.py。验证：./venv/bin/python -m pytest tests/test_nav_series.py -q 全过。
      serves:
        - FR-4
        - FR-5
        - FR-7
      depends_on: []
      phase: implement
      side: backend
