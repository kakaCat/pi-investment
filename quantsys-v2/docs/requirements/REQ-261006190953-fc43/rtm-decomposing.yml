      implements: "改 application/services/evolution/daily_snapshot_service.py：snapshot_all_accounts 汇总 refused（被闸门拒写的账户数）与 trading_day 五键，written 不计被拒账户；EquitySnapshotJob._has_bar 由“交易日代理判据”降级为“是否已收盘”辅助判据，交易日判定交给闸门，reason 文案区分“非交易日”与“未收盘”。改 application/trading/paper_trading_engine.py：take_daily_snapshot 处理闸门返回 None（不得 AttributeError），返回 {'skipped': True, 'reason': ..., 'trading_day_source': ..., 'trading_day': 五键}。改 tests/test_daily_jobs_trading_day_gate.py 补 EquitySnapshotJob 休市日用例；扩展 tests/test_equity_snapshot_trading_day_gate.py 的服务路径部分。验证：./venv/bin/python -m pytest tests/test_daily_jobs_trading_day_gate.py tests/test_equity_snapshot_trading_day_gate.py -q 全过。"
