outputs:
  tasks:
    - id: t-dc66e2
      title: 实现交易日解析器（最近一个已收盘交易日）
      implements: 新增 application/services/trading_day_resolver.py。定义 TradingDayResult(date, source, degraded) 与 last_closed_trading_day(ref, *, cutoff=15:30, provider_lookback_days=30)。anchor = ref.date() 若 >=15:30 否则 ref.date()-1；结果 = 日历中 <=anchor 的最大交易日。三级解析：① quant.trading_calendar（需 max(trade_date)>=anchor 才算覆盖）；② ServiceFactory.get_data_provider_manager().get_trading_calendar(start, anchor)；③ 周一至周五回退。任一级失败不抛异常、记 warning、降级；source 取 calendar_table|provider|weekday_fallback。
      serves:
        - FR-1
      depends_on: []
      phase: implement
      side: backend
    - id: t-b952d0
      title: 写日期表驱动回归用例（含降级与周末语义）
      implements: 新增 tests/test_trading_day_resolver.py；注入假日历与假 provider，零网络零 DB。覆盖 test-cases.md 用例 1-7（10-04→09-30、10-02 16:00→09-30、10-08 15:29→09-30、10-08 15:30→10-08、09-25→09-24、09-26→09-24、09-29→09-28）。覆盖降级用例 8-10：表空走 provider、provider 抛异常→weekday_fallback 且不抛、返回空→降级并记 warning（caplog 断言）。
      serves:
        - FR-1
        - FR-4
      depends_on:
        - t-dc66e2
      phase: test
      side: backend
    - id: t-f062d4
      title: 探针接入新口径并标注判定来源
      implements: tools/health_probe.py：expected_trading_day() 改为调 last_closed_trading_day（删掉 import _last_trading_day 的路径）。probe_freshness() 返回体新增 expected_source、expected_degraded，既有键语义不变。build_alert() 仅在 expected_degraded 为真时追加降级标注，正常路径正文与现状逐字一致。同步新增 tests/test_health_probe.py（用例 11-13）：打桩 resolver 与 kline_latest，断言 ok/lag_days/两个新键；只测 probe_freshness 与 build_alert，不调 main()/send_alert。
      serves:
        - FR-2
        - FR-4
      depends_on:
        - t-dc66e2
      phase: implement
      side: backend
    - id: t-1d780d
      title: freshness_guard 复用同一实现
      implements: adapters/inbound/fastapi_app/daily_jobs/pipeline.py:_last_trading_day(ref)->str 签名与返回类型不变，内部改调 last_closed_trading_day(ref).date.isoformat()。行 76/177 两个调用点输入不变（177 仍传 now-1 天）。return 字典新增 expected_source 键（jsonb，无需迁移）；其余键与判定逻辑一行不改。daily_jobs_bootstrap 的转发导出保持不变（44 个模块的导入路径不动）。
      serves:
        - FR-3
      depends_on:
        - t-dc66e2
      phase: implement
      side: backend
    - id: t-ed8425
      title: 刷新脚本改接 provider 源并一次性回填日历表
      implements: tools/refresh_trading_calendar.py：数据源改为 get_data_provider_manager().get_trading_calendar（含未来交易日），与既有 daily_klines DISTINCT trade_date 取并集。保留原有 ON CONFLICT DO NOTHING 与空表时的复合主键确保逻辑。先 --dry-run 看清将写入行数，再实跑一次回填 quant.trading_calendar（只写 TRUE/FALSE，不写 NULL）。
      serves:
        - FR-1
      depends_on:
        - t-dc66e2
      phase: implement
      side: backend
