  tasks:
    - id: t-d24cfb
      title: 落码表与裁决结果契约（EscalationCode + Verdict）
      implements: 新建 domain/watch/services/escalation_verdict.py：先落 EscalationCode（15 个受控码 + ALL + PATH_LABEL 映射）与 frozen dataclass Verdict(should_wake, code, reason, path, note) 及 overridden()；不写裁决逻辑。测试 tests/services/test_watch_escalation_verdict.py 先写码表断言（15 值、PATH_LABEL 覆盖全部码、Verdict 不可变）。
      serves:
        - FR-1
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-2f1402
      title: 收敛出唯一裁决出口 decide_escalation（15 条顺序表）
      implements: 在 domain/watch/services/escalation_verdict.py 补 decide_escalation（宪法级 → 预算 → 规则显式 → 异常波动 → L2 → 元触发 → 五道门 → 兜底）与 decide_escalation_paths（仅三条可信路径，含 L0/L1 与 auto_escalate 短路）；三条路径与文案自 domain/watch/services/escalation_checker.py 迁入且逐字保留；metric 不符沿用 require_metric 抛错。tests/services/test_watch_escalation_verdict.py 补 15 行真值表与跨入口一致性用例。
      serves:
        - FR-1
      depends_on:
        - t-d24cfb
      phase: implement
      side: backend
    - id: t-152a0b
      title: 规则侧显式化与人话说明（explain_escalation + 默认值显式化）
      implements: domain/watch/models.py：EscalationPolicy.default() 改为显式含 anomaly_change_pct（取 EscalationChecker.DEFAULT_ANOMALY_CHANGE_PCT 常量，不手写 5.0），新增 to_dict() 只输出 auto_escalate 与 anomaly_change_pct（不回写历史字段）。在 escalation_verdict.py 新增 explain_escalation(rule) -> str，按 L2 / auto_escalate 关闭 / 显式 escalate / 阈值覆写 / 策略未声明 分支给一句人话；策略缺失时返回「策略未声明（按默认口径）」而非空串。测试 tests/domain/test_escalation_policy_defaults.py。
      serves:
        - FR-4
      depends_on:
        - t-d24cfb
      phase: implement
      side: backend
    - id: t-fa9574
      title: 兼容壳：EscalationChecker.should_escalate 委托出口
      implements: domain/watch/services/escalation_checker.py 改为薄壳：should_escalate 内部委托 decide_escalation_paths，返回 reason 字符串或 None，签名与文案逐字不变；构造参数 anomaly_change_pct 保留。既有用例 tests/services/test_escalation_checker.py 与 tests/services/test_metric_contract.py 一行不改。
      serves:
        - FR-1
      depends_on:
        - t-2f1402
      phase: implement
      side: backend
    - id: t-2fbc40
      title: 处置映射：disposition.decide 接受 Verdict
      implements: domain/watch/services/disposition.py：decide() 增可选参数 verdict；给定时按 Verdict 映射为既有 disposition 取值与既有中文文案，未给定时内部调 decide_escalation（行为同改造前，兼容 escalated / escalation_reason 两个旧参数）。application/services/watch_engine/disposition_engine.py 透传 verdict。
      serves:
        - FR-1
      depends_on:
        - t-2f1402
      phase: implement
      side: backend
    - id: t-08d545
      title: tick() 单链路接线（裁决 → 处置 → 去重覆盖 → 通知）
      implements: application/services/watch_engine/engine.py：把 escalation.check 换成 decide_escalation（gate 用既有字段组装），disposition.decide 传 verdict；去重与抑噪命中时用 Verdict.overridden 覆盖为 DEDUPED / SUPPRESSED 并把原判写进 reason；events 增 escalation_code 键（不改既有键）。application/services/watch_engine/escalation_coordinator.py 退回数据收集（组装 QuoteData 与 trigger_level），check() 保留兼容。
      serves:
        - FR-1
        - FR-2
      depends_on:
        - t-fa9574
        - t-2fbc40
      phase: implement
      side: backend
    - id: t-761703
      title: 迁移：watch_triggers 加两列（两个库都跑）
      implements: 新建 infrastructure/persistence/migrations/20261007_watch_trigger_escalation.py：SET lock_timeout='30s' 后 ADD COLUMN IF NOT EXISTS escalation_code TEXT / escalation_reason TEXT，幂等，--apply 后打印 information_schema 读数；adapters/outbound/repositories/watch_rule_repository.py 的 WatchTrigger 模型同步加两列。两个库（quant_test 与 quant_investment）都要执行。
