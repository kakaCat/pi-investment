    - id: t-9c727a
      title: 新建通知判据模块 notify_policy（无事判据 + env 解析）
      implements: 按 design/interfaces.md §1 新建 adapters/inbound/fastapi_app/daily_jobs/notify_policy.py：常量 NO_OP_STATUSES={'no_event','no_op'} 与 RUNNING_NOTICE_DEFAULT_SECONDS=60.0；函数 is_no_op（严格 no_output is True 或 status.strip().lower() 命中白名单，其余一律 False）、notify_noop_enabled、running_notice_seconds（未设/非数→60.0，<=0→0.0）、should_send_start（= notify_noop_enabled）、should_send_completion（manual→True 优先；开关打开→True；is_no_op→False；否则 True）。env 解析复用同包 interval._env_flag；不新增跨层依赖（kb-conventions-c01）；任何输入不得抛异常。
      serves:
        - FR-1
        - FR-7
      depends_on: []
      phase: implement
      side: backend
    - id: t-9a1066
      title: alerting 抽出完成消息组装 format_completion
      implements: "在 adapters/inbound/fastapi_app/daily_jobs/alerting.py 新增 format_completion(job_id, description, elapsed, result, *, manual=False, warn_no_output=False) -> str：标题优先级 manual（'✅ 每日任务完成（人工触发）：{job_id}'）> warn_no_output（'⚠️ 每日任务完成（无有效产出）：{job_id}'）> '✅ 每日任务完成：{job_id}'；正文 {description}\\n耗时: {_format_elapsed(elapsed)} + 非空摘要（_summarize_result）。不改 _send_feishu / _summarize_result / _format_elapsed / _job_failure_watch。"
      serves:
        - FR-2
        - FR-6
        - FR-7
      depends_on: []
      phase: implement
      side: backend
    - id: t-15bb12
      title: runtime 接线：通知收敛 + manual 参数 + 超阈值提示 + trigger_job
      implements: "daily_jobs/runtime.py：① _run_job(job, run_date, manual: bool = False)；② 删 runtime.py:126 的无条件开始消息，改为 if notify_policy.should_send_start(): _send_feishu(旧开始文案)（仅回滚态为真）；③ handler() 前 timer=_arm_running_notice(job)，finally 里 timer.cancel()；④ 完成分支改为 if should_send_completion(result=result, manual=manual): _send_feishu(alerting.format_completion(..., warn_no_output=notify_policy.notify_noop_enabled() and result.get('no_output') is True))；⑤ 抑制外发时 logger.info('inprocess_job_notify_skipped', job=..., reason='no_op', manual=...)；⑥ 内层失败与异常两处 _send_feishu 逐字不动；⑦ 新增 _arm_running_notice（running_notice_seconds()<=0 返回 None；threading.Timer daemon=True，秒数用 _format_elapsed 渲染）与 _send_running_notice（消息 '⏳ 每日任务仍在运行：{job_id}\\n{description}\\n已跑 {_format_elapsed(secs)}'；回调内异常吞掉并记 inprocess_job_running_notice_error；两函数必须住在 runtime.py 以保住打桩点）；⑧ trigger_job 线程调用传 manual=True（签名/返回体不变）。daily_jobs_bootstrap.py 的转发 import 与 __all__ 补 _arm_running_notice / _send_running_notice；不改 daily_jobs/__init__.py。"
      serves:
        - FR-2
        - FR-3
        - FR-4
        - FR-5
        - FR-6
      depends_on:
        - t-9c727a
        - t-9a1066
      phase: implement
      side: backend
    - id: t-1ec5fa
      title: 新增 tests/test_daily_jobs_quiet_noop.py（T-1~T-16 回归锁）
      implements: 新建 tests/test_daily_jobs_quiet_noop.py，实现 design/test-cases.md §2 的 T-1~T-16（判据白名单与反例、开关/阈值解析、宿主无事零消息而台账 success、有产出一条完成、异常 🚨、内层失败优先、人工触发回执、开关态旧行为、阈值内不发/超阈值发「⏳ 仍在运行」、阈值 0 关闭、回调异常不影响任务、trigger_job 传 manual=True）。打桩点必须是 runtime._send_feishu / runtime._mark_running / runtime._mark_done；env 用 monkeypatch.setenv；T-13 用 time.sleep(0.3) + 阈值 0.05。用例总数不超过 16 条，不做与 FR 无关扩展。
      serves:
        - FR-1
        - FR-2
        - FR-3
        - FR-4
        - FR-6
        - FR-7
        - FR-8
      depends_on:
        - t-15bb12
      phase: test
      side: backend
