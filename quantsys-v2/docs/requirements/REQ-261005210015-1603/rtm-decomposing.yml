    - id: t-a494c4
      title: handler 组装：summary / no_output / 空转统计（含纯函数与查询失败降级）·研发
      implements: |-
        adapters/inbound/fastapi_app/daily_jobs/pipeline.py：_job_evolution_fitness() 调 t3 的两个只读方法算出 last_ok_window_end 与 idle_streak（新增模块级纯函数 _derive_idle_streak(counts_desc) -> (int, bool)，bool 表示是否被 limit 截断）；按设计文档的接口契约 A 拼 summary（有效 N（样本不足 x / 无成交 y / 数据缺口 z），computed_ok 为 0 且 streak 大于等于 2 时追加「已连续 N 次无有效产出（最近有效：YYYY-MM-DD）」，streak 等于 1 时写「本次无有效产出」，computed_ok 大于 0 时不追加）；no_output = (computed_ok == 0)；返回体保留 detail 与 note 并新增顶层 summary 与 no_output。两次只读查询任一抛错时：logger.error + summary 追加「空转统计不可用」+ 不外抛（任务仍记 success）。不得在 detail 里引入 success 或 status 键，也不得把 data_gap 写成 no_data（会撞 _GAP_KEYS 触发误判失败）。

        [子卡阶段·研发] 只做本阶段；验收：`npx vitest run <本卡改动涉及的测试文件>` → 全绿；并附 `git diff --stat` 摘要
      serves: []
      depends_on:
        - t-cda13d
        - t-c0941a
        - t-17fce0
      phase: implement
      side: backend
