      phase: implement
      side: backend
    - id: t-c0941a
      title: fitness 服务诚实计数：四类状态 + accounts_total，删 skipped、收窄 computed 语义
      implements: application/services/evolution/evolution_fitness_service.py：compute_all_accounts() 按 result 的 status 累加 computed_ok / insufficient_sample / no_trades / data_gap / other（data_gap 走服务侧无对齐日期分支），返回体新增 accounts_total（遍历到的 active 账户数）与 aligned_days（本次对齐窗口天数）；删除写死的 skipped 键；保留 computed 键且其值 == accounts_total，并在 docstring 写明 computed 是遍历到的账户数、不是有效条数，唯一可称算出来的数是 computed_ok。另改 application/services/daily_orchestrator.py 复核阶段日志行，补打 computed_ok。
      serves:
        - FR-4
      depends_on: []
      phase: implement
      side: backend
    - id: t-17fce0
      title: 空转读数：EvolutionFitnessORMRepository 两个只读聚合方法
      implements: adapters/outbound/repositories/evolution_fitness_repository.py：新增 list_recent_window_ok_counts(limit=20, window_days=20) -> List[Tuple[date,int]] —— group_by(window_end) + count(case((status 等于 ok,1)))，按 window_end 倒序、按 limit 截断；新增 get_last_ok_window_end(window_days=20) -> Optional[date] —— max(window_end) where status 等于 ok。两者只读、不写库、不加列、不改 DDL。
      serves:
        - FR-5
      depends_on: []
      phase: implement
      side: backend
    - id: t-2d12c5
      title: handler 组装：summary / no_output / 空转统计（含纯函数与查询失败降级）
      implements: adapters/inbound/fastapi_app/daily_jobs/pipeline.py：_job_evolution_fitness() 调 t3 的两个只读方法算出 last_ok_window_end 与 idle_streak（新增模块级纯函数 _derive_idle_streak(counts_desc) -> (int, bool)，bool 表示是否被 limit 截断）；按设计文档的接口契约 A 拼 summary（有效 N（样本不足 x / 无成交 y / 数据缺口 z），computed_ok 为 0 且 streak 大于等于 2 时追加「已连续 N 次无有效产出（最近有效：YYYY-MM-DD）」，streak 等于 1 时写「本次无有效产出」，computed_ok 大于 0 时不追加）；no_output = (computed_ok == 0)；返回体保留 detail 与 note 并新增顶层 summary 与 no_output。两次只读查询任一抛错时：logger.error + summary 追加「空转统计不可用」+ 不外抛（任务仍记 success）。不得在 detail 里引入 success 或 status 键，也不得把 data_gap 写成 no_data（会撞 _GAP_KEYS 触发误判失败）。
      serves:
        - FR-2
        - FR-3
        - FR-5
      depends_on:
        - t-cda13d
        - t-c0941a
        - t-17fce0
      phase: implement
      side: backend
    - id: t-4b35ba
      title: runtime 接线：耗时按量级显示 + 零产出改 ⚠️（不动 status、不碰跳过分支）
      implements: adapters/inbound/fastapi_app/daily_jobs/runtime.py 的 _run_job 成功分支：elapsed 改经 alerting._format_elapsed 渲染（替换现有 f-string 的分钟格式化）；完成标题前缀改为条件表达式 —— result.get('no_output') is True 时用「⚠️ 每日任务完成（无有效产出）：」，否则维持「✅ 每日任务完成：」。硬约束：不改 _mark_done 的 status（仍 success）、不改 find_result_failure 的调用与口径、不碰任何跳过或门控分支（那是 REQ-261005203907-2b8c 的地盘）、不改 _send_feishu 与失败告警文案。
      serves:
