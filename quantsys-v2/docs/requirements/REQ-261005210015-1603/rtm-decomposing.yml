      title: 通知层契约落地：_format_elapsed + _summarize_result 支持顶层 summary
      implements: adapters/inbound/fastapi_app/daily_jobs/alerting.py：新增 _format_elapsed(seconds) -> str —— 秒数小于 60 用 f-string 渲染为 X.X 秒，否则渲染为 X.X 分钟（均 1 位小数），负数按 0 处理；改造 _summarize_result —— 当 result.get('summary') 是非空字符串时，以其为 parts 首段且不再输出子字典段，否则逐字保持现有行为（其他任务零变化）；白名单键补 computed_ok / insufficient_sample / no_trades / data_gap / no_output（兜底可见）。不改 _send_feishu。
