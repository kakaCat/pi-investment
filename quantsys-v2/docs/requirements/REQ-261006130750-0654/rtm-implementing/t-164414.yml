  title: 给 IntradayMonitor.check() 加权威日级门·测试
  status: done
  implements: |-
    改 application/services/intraday_monitor.py：① 模块级新增常量 SKIP_REASON_NON_TRADING_DAY = 'non-trading-day'；② check() 签名改为 check(self, now: Optional[datetime] = None)（缺省 datetime.now()，向后兼容）；③ 在既有时段判定之后插日级门：skip, info = should_skip('trading-days', now)（from application.services.trading_day_gate import should_skip），skip 为真时立即返回 {'status':'skipped','reason':SKIP_REASON_NON_TRADING_DAY,'timestamp':now.isoformat(),'trading_day':info}，不得构造 PaperTradingEngine、不得读持仓/价格、不得写市值；④ _is_trading_time 的 docstring 改为指向本门（逻辑一行不改）。顺序不可调（日级门必须在时段判定之后）。依据 design/interfaces.md §3。

