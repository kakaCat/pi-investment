  tasks:
    - id: t-37a691
      title: 给 IntradayMonitor.check() 加权威日级门
      implements: "改 application/services/intraday_monitor.py：① 模块级新增常量 SKIP_REASON_NON_TRADING_DAY = 'non-trading-day'；② check() 签名改为 check(self, now: Optional[datetime] = None)（缺省 datetime.now()，向后兼容）；③ 在既有时段判定之后插日级门：skip, info = should_skip('trading-days', now)（from application.services.trading_day_gate import should_skip），skip 为真时立即返回 {'status':'skipped','reason':SKIP_REASON_NON_TRADING_DAY,'timestamp':now.isoformat(),'trading_day':info}，不得构造 PaperTradingEngine、不得读持仓/价格、不得写市值；④ _is_trading_time 的 docstring 改为指向本门（逻辑一行不改）。顺序不可调（日级门必须在时段判定之后）。依据 design/interfaces.md §3。"
      serves:
        - FR-1
        - FR-3
        - FR-5
        - FR-6
      depends_on: []
      phase: implement
      side: backend
    - id: t-bcbe54
      title: 编排循环加 A 层日历预过滤与跳过去噪
      implements: "改 adapters/inbound/fastapi_app/orchestrator_bootstrap.py：① 新增模块级 _LAST_SKIP_LOG: Dict[str, str] 与 _should_run_today(now, *, path) -> Tuple[bool, Dict]（内部只调 from application.services.trading_day_gate import should_skip，策略固定 'trading-days'；返回 (not skip, info)；skip 为真时按 (path, day) 去噪记一条 logger.info('orchestrator_trading_day_skip', path=…, day=…, is_trading_day=…, source=…, degraded=…, reason=…)；函数内不得出现 weekday()、不得直查 trading_calendar、不得抛异常）；② _monitor_loop 两个分支内各插一次判定，path 取 'orchestrator_tick' / 'intraday_monitor'，仅当 run 为真才调 monitor_jobs.daily_orchestrator_tick() / monitor_jobs.intraday_monitor_check()；既有 try/except 与 finally close_session()、窗口函数 _in_orchestrator_window / _in_intraday_window 原样不动。依据 design/interfaces.md §2。"
      serves:
