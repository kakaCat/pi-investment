  tasks:
    - id: t-c52a0a
      title: 新增结果契约与失败可见性出口
      implements: 新增 application/observability/run_outcome.py（RunOutcome 值对象：executed/action/reason/error/detail，ok 只由 executed and error is None 派生，reason 受控枚举，to_dict 为既有字段超集）与 application/observability/failure_sink.py（report_failure(source, reason, error, severity, context)：先结构化日志再经 NotificationFacade 外发，自身绝不抛异常）；新增 tests/test_run_outcome.py、tests/test_failure_sink.py。不改动任何既有算法。
      serves:
        - FR-1
        - FR-2
        - FR-9
      depends_on: []
      phase: implement
      side: backend
    - id: t-b13aaf
      title: 策略日检如实上报并修回通知方法
      implements: "改 live_trading/simulation_trader.py：run_daily_check 消费 self.rebalance(today) 的返回值，成功与否如实映射为 RunOutcome；rebalance 的 except 分支改为 logger.error(exc_info=True) + FailureSink.report_failure；把误缩进在 if __name__ == '__main__': 块内的 _send_rebalance_notification 与 _format_rebalance_content 移回类体，并保证通知失败不改变调仓成功判定（进 detail['notify_error']）。改 application/services/strategy_service.py 的 daily_check 为三态映射（success/skipped/failed）。改 tests/test_v13_scheduler.py：把三处 return True/False 的假绿灯改成真断言。新增 tests/live_trading/test_daily_check_contract.py。"
      serves:
        - FR-1
        - FR-2
      depends_on:
        - t-c52a0a
      phase: implement
      side: backend
    - id: t-da8070
      title: 交易日判定收敛到日历链
      implements: 在 application/services/trading_day_resolver.py 内补一个「指定日是否交易日」的姊妹函数，与 last_closed_trading_day 共用取数链（quant.trading_calendar 带 max(trade_date) >= anchor 有效性校验 → DataProviderManager → 周一~周五回退并标 degraded）；改 application/services/trading_day_guard.py 的 _compute：周末/未来/日历链三级判定，移除「近 7 日有 K 线」启发式（K 线降为事后交叉校验并记 degraded + 告警），新增 source 常量 trading-calendar / trading-calendar-holiday；改 application/services/trading_calendar_service.py 让工作日兜底可见（带 degraded/source）；judge_trading_day 末位新增可选参数 calendar_has_day=None（None 时走旧逻辑，保住既有 8 条单测）；增补 tests/test_trading_day_guard.py。
      serves:
        - FR-3
      depends_on: []
      phase: implement
      side: backend
    - id: t-141b38
      title: 挂单撮合批量不中断、时段护栏与过期收口
      implements: "改 application/services/account_trading_service.py 的 execute_pending_orders：单笔由只 catch TradingError 改为 catch Exception → 该单标 failed + fail_reason='internal_error: <原文>' 并继续下一笔；入口先判交易时段（复用 _check_trading_window/_is_in_trading_window，唯一时段口径为 MarketSessionPolicy）——非交易时段只累加 skipped_off_hours 并留痕，绝不把挂单批量标 failed；pending 超过 1 个交易日未成交 → status='expired' + fail_reason + FailureSink 告警；返回体新增 errored/skipped_off_hours/expired；增补 tests/services/test_pending_orders.py。"
      serves:
        - FR-7
      depends_on:
        - t-c52a0a
      phase: implement
      side: backend
    - id: t-0257b0
      title: cron 时刻口径、misfire 语义与「被跳过」落库
      implements: 改 infrastructure/scheduler/apscheduler_service.py：加载器区分 misfire_grace_time_seconds IS NULL（按本仓口径=唤醒必补跑）与显式值，去掉 or 300 的隐式兜底；注册 EVENT_JOB_MISSED 监听，把被跳过的 slot 写成 scheduler_runs 一行（status='missed'，error 记录 missed by Xm）并同步 scheduler_tasks.last_status/last_error；改 adapters/outbound/repositories/scheduler_repository.py 支持写 missed 状态、并修正 next_run_at 口径（与 public.apscheduler_jobs 的真实 next_run_time 一致，或明确标注该字段失效）；库内把 v13 任务 cron 由 30 6 * * 1-5 改为 30 14 * * 1-5（恢复 is_enabled=true 一并在此卡完成，止血记录里的原值可回滚）；新增 tests/test_scheduler_misfire_semantics.py。
