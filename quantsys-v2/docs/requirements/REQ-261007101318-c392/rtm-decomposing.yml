    - id: t-268fbd
      title: FR-1 休市日闸门：tick() 日级收敛到 TradingDayGuard（回填）
      implements: application/services/watch_engine/engine.py：新增 _resolve_trading_day(day) 作为 tick() 与 run_forever() 的唯一日级入口（默认 TradingDayGuard.check，支持 is_trading_day_fn/trading_day_verdict_fn 注入）；tick() 前置改为「日级 + 时段」双闸门，未开市时调用 _log_market_closed() 按日去重留痕后 return []（不取规则、不评估、不落库、不外发）；判定异常一律保守判非交易日。新增 tests/services/test_watch_engine_trading_day_gate.py 锁定四条行为。
      serves:
        - FR-1
      depends_on: []
      phase: implement
      side: backend
    - id: t-d5d9b6
      title: FR-2 名称兜底：禁止把代码当名称（回填）
      implements: application/services/watch_engine/notifier.py：facade 调用改为 name=payload.name or None（删除 name or symbol 的混同）；_lookup_stock_name 的取数口径并入领域端口实现 PgStockNameResolver.resolve_batch（与 SLA 巡检/回执同一份，异常/未命中返回 None）。infrastructure/notification/formatters/feishu_formatters.py：旧渲染路径名称缺失时显式输出「{代码}（名称缺失）」，不再回落成裸代码。tests/notification/test_req_c392_notification_contract.py 增补名称相关断言。
