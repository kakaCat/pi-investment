      title: FR-4 文案契约：意图/处置级别 + 闭环承诺解耦（回填）
      implements: application/services/watch_engine/engine.py：_notify_level 去掉 todo_service is None 的早退（级别恒解析），notify_kwargs 增加 closed_loop=(todo_service is not None)。dto.py：TriggerPayload 增加 closed_loop 并随 variables 下发。notification_facade.py、watch_level_templates.py、feishu_formatters.py：新增「处置级别」行（TRIGGER_LEVEL_META）与来源尾注；闭环承诺（处置入口/不可静默/回执位/待办#）改由 closed_loop 门控。翻新三处旧契约测试：tests/application/test_watch_disposition_engine.py（替身接受 level/closed_loop）、test_watch_t12_todo_creation.py、test_watch_t12_wiring.py。
      serves:
        - FR-4
