name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./web-frontend
        run: npm ci

      - name: Build for production
        working-directory: ./web-frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create distribution archive
        working-directory: ./web-frontend
        run: |
          tar -czf ../pi-investment-web-${{ github.ref_name }}.tar.gz dist/
          zip -r ../pi-investment-web-${{ github.ref_name }}.zip dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log $PREV_TAG..${{ github.ref_name }} --pretty=format:"- %s (%h)" --no-merges)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download the archive and extract to your web server:

            ```bash
            # Using tar.gz
            tar -xzf pi-investment-web-${{ github.ref_name }}.tar.gz

            # Using zip
            unzip pi-investment-web-${{ github.ref_name }}.zip
            ```

            ## Docker

            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/pi-investment-web:${{ github.ref_name }}
            ```
          files: |
            pi-investment-web-${{ github.ref_name }}.tar.gz
            pi-investment-web-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build-release-docker:
    name: Build and Push Release Docker Image
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web-frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pi-investment-web:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/pi-investment-web:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/pi-investment-web:latest
          labels: |
            org.opencontainers.image.title=PI Investment Web
            org.opencontainers.image.description=PI Investment Web Frontend
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pi-investment-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/pi-investment-web:buildcache,mode=max

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-release-docker]
    if: always()

    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 New release published: ${{ github.ref_name }}
            Repository: ${{ github.repository }}
            Author: ${{ github.actor }}

            Download: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
