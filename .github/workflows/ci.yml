name: QuantSys V2 CI

on:
  push:
    branches: [ main, master, optimize/**, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ========================================
  # Job 1: 环境和代码质量检查
  # ========================================
  lint-and-check:
    name: Lint and Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0  # ruff 增量门禁需要 merge-base

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Verify Python version
      run: |
        python --version
        if [[ $(python --version | grep -o "3\.12") != "3.12" ]]; then
          echo "❌ 错误: Python 版本必须是 3.12+"
          exit 1
        fi
        echo "✅ Python 版本检查通过"

    - name: Create virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt || echo "requirements.txt not found, skipping"
        pip install structlog uvicorn fastapi  # 强制安装核心依赖

    - name: Check logging standards
      run: |
        cd quantsys-v2
        echo "🔍 检查日志规范..."

        # 检查启动文件中是否有 logging.basicConfig
        if grep -r "logging.basicConfig" start_all.py adapters/inbound/fastapi_app/main.py 2>/dev/null; then
          echo "❌ 启动文件中发现 logging.basicConfig"
          exit 1
        fi

        echo "✅ 日志规范检查通过"

    - name: Check for print() in business code
      run: |
        cd quantsys-v2
        echo "🔍 检查业务代码中的 print() 使用..."

        # 检查 Service 层是否有 print()（排除注释）
        if find application/services -name "*.py" -exec grep -l "print(" {} \; 2>/dev/null | grep -v test; then
          echo "⚠️  警告: 业务代码中发现 print() 使用"
          echo "   建议使用结构化日志"
          # 不阻止 CI，仅警告
        fi

    - name: Ruff gate - no NEW print() / blind except
      run: |
        cd quantsys-v2
        pip install ruff
        echo "🔍 Phase 1 门禁：变更文件不得新增 print()/裸 except（T201/BLE001）..."

        # 存量违规 3200+ 处（见 phase1 报告），整文件硬门禁会误伤历史债务。
        # 采用计数对比棘轮：变更文件的违规数不得多于 origin/main 同文件。
        git fetch origin main --quiet || true
        CHANGED=$(git diff --name-only origin/main...HEAD -- 'quantsys-v2/*.py' 2>/dev/null | sed 's|^quantsys-v2/||' || true)
        if [ -z "$CHANGED" ]; then
          echo "✅ 无 quantsys-v2 Python 变更，跳过"
          exit 0
        fi

        git worktree add /tmp/ruff-base origin/main --detach --quiet 2>/dev/null || true
        # 老基线可能没有 ruff 配置，用当前配置保证口径一致
        cp .ruff.toml /tmp/ruff-base/quantsys-v2/.ruff.toml 2>/dev/null || true

        FAIL=0
        for f in $CHANGED; do
          [ -f "$f" ] || continue
          NEW=$(ruff check --config .ruff.toml --select T201,BLE001 --quiet "$f" 2>/dev/null | grep -cE "T201|BLE001" || true)
          OLD=0
          if [ -f "/tmp/ruff-base/quantsys-v2/$f" ]; then
            OLD=$(cd /tmp/ruff-base/quantsys-v2 && ruff check --config .ruff.toml --select T201,BLE001 --quiet "$f" 2>/dev/null | grep -cE "T201|BLE001" || true)
          fi
          if [ "$NEW" -gt "$OLD" ]; then
            echo "❌ $f: 违规 $OLD → $NEW（新增 $((NEW-OLD)) 处）"
            FAIL=1
          fi
        done
        if [ "$FAIL" -eq 0 ]; then
          echo "✅ ruff 增量门禁通过（无新增违规）"
        else
          echo "💡 修复：print() 改 structlog；裸 except 改具体异常（domain/exceptions.py）"
          exit 1
        fi

    - name: Ruff full check (informational)
      continue-on-error: true
      run: |
        cd quantsys-v2
        pip install ruff
        echo "ℹ️  全量 ruff 检查（仅报告，不阻断；存量违规随 Phase 2-4 逐步清零）"
        ruff check --config .ruff.toml --statistics . || true

    - name: Install pre-commit hook
      run: |
        cd quantsys-v2
        if [ -f pre-commit ]; then
          cp pre-commit .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit
          echo "✅ Pre-commit hook 已安装"
        fi

  # ========================================
  # Job 2: 单元测试
  # ========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install pytest pytest-cov structlog uvicorn fastapi

    - name: Run tests
      run: |
        source .venv/bin/activate
        cd quantsys-v2
        if [ -d tests ]; then
          pytest tests/ -v --tb=short
        else
          echo "ℹ️  未找到测试目录，跳过"
        fi

  # ========================================
  # Job 3: 服务启动测试
  # ========================================
  startup-test:
    name: Service Startup Test
    runs-on: ubuntu-latest
    needs: lint-and-check

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_investment
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install structlog uvicorn fastapi psycopg2-binary

    - name: Test environment check
      run: |
        source .venv/bin/activate
        cd quantsys-v2
        python -c "import sys; print(f'Python: {sys.version}')"
        python -c "import structlog; print('✅ structlog installed')"
        python -c "import uvicorn; print('✅ uvicorn installed')"
        python -c "import fastapi; print('✅ fastapi installed')"

    - name: Test service startup (dry run)
      run: |
        source .venv/bin/activate
        cd quantsys-v2

        # 测试 start_all.py 的环境检查
        python start_all.py --help 2>&1 | head -20 || true

        echo "✅ 启动脚本环境检查通过"

  # ========================================
  # Job 4: P0 任务门禁检查
  # ========================================
  p0-gate-check:
    name: P0 Gate Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check P0 completion
      run: |
        cd quantsys-v2
        echo "🚪 P0 任务门禁检查..."

        PASSED=0
        TOTAL=0

        # 检查 .python-version
        ((TOTAL++))
        if [ -f .python-version ]; then
          echo "✅ .python-version 存在"
          ((PASSED++))
        else
          echo "❌ 缺少 .python-version"
        fi

        # 检查 PYTHON_ENVIRONMENT.md
        ((TOTAL++))
        if [ -f PYTHON_ENVIRONMENT.md ]; then
          echo "✅ PYTHON_ENVIRONMENT.md 存在"
          ((PASSED++))
        else
          echo "❌ 缺少 PYTHON_ENVIRONMENT.md"
        fi

        # 检查 LOGGING_WORKFLOW.md
        ((TOTAL++))
        if [ -f LOGGING_WORKFLOW.md ]; then
          echo "✅ LOGGING_WORKFLOW.md 存在"
          ((PASSED++))
        else
          echo "❌ 缺少 LOGGING_WORKFLOW.md"
        fi

        # 检查 pre-commit hook
        ((TOTAL++))
        if [ -f pre-commit ]; then
          echo "✅ pre-commit hook 存在"
          ((PASSED++))
        else
          echo "❌ 缺少 pre-commit hook"
        fi

        # 检查启动脚本中的环境检查
        ((TOTAL++))
        if grep -q "check_environment" start_all.py; then
          echo "✅ start_all.py 包含环境检查"
          ((PASSED++))
        else
          echo "❌ start_all.py 缺少环境检查"
        fi

        echo ""
        echo "门禁检查结果: $PASSED/$TOTAL"

        if [ $PASSED -eq $TOTAL ]; then
          echo "✅ P0 任务门禁通过"
          exit 0
        else
          echo "❌ P0 任务门禁未通过"
          exit 1
        fi
