# @pi-investment/dsh-bundle —— PI Investment 插件集伞 bundle
# 本文件是 bundle 的 patch 层（package.json 的 dsh.bundle.patch 指向这里）。
# 2026-09-22（REQ-260922133113-ebc5）：从 config/cordis.yml 的「投资插件」insert 块整体迁入。
# 迁移原因：DSH 侧边栏「插件」页只管理 bundle（profile 清单 dsh.profile.bundles +
# 包内 dsh.bundle 元数据），裸 insert 行不可见、被标 unaddressable。迁入 bundle 层后，
# 插件页出现「PI Investment」包卡片，下列每一行可在 GUI 单独开关（开关 = 往用户层
# cordis.patch.yml 写同 id 的 disabled 覆盖行，最后写入层生效）。
# 新增插件纪律：在 packages/ 下建好插件包后，把它的行加进**本文件**（不再加进
# config/cordis.yml），并重启生效。行内 config 的语义注释随行保留。

# ========== 投资插件 ==========
- insert:
    - id: dsh-pmboard
      name: 'dsh-pmboard'
      config:
        # REQ-260922012924-2e29 FR-3：开启节点压缩（D1 第二步；G0 门在需求文档未落盘时仍会 skip(doc_not_ready) 保护立项上下文）。回滚：改回 false + 重启。
        nodeIsolation: true

    # 页面自愈：监听框架免鉴权的 /plugins/events SSE，发现服务端换过进程就刷新标签页
    # （2026-09-16 事故：重启后已开标签页能开、消息发不出去）。host 半为空壳。
    - id: web-liveness
      name: '@pi-investment/web-liveness'
      config: {}

    - id: investment
      name: '@pi-investment/investment'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: trading
      name: '@pi-investment/trading'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: intelligence
      name: '@pi-investment/intelligence'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: competition
      name: '@pi-investment/competition'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: market
      name: '@pi-investment/market'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: risk
      name: '@pi-investment/risk'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: strategy
      name: '@pi-investment/strategy'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: factor
      name: '@pi-investment/factor'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: data-manager
      name: '@pi-investment/data-manager'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: memory
      name: '@pi-investment/memory'
      config:
        quantsysV2:
          baseURL: http://localhost:5001
        agentOS:
          baseURL: http://localhost:8080
          agentId: agent-dh

    - id: evolution
      name: '@pi-investment/evolution'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: scheduler
      name: '@pi-investment/scheduler'
      config:
        agentOS:
          baseURL: http://localhost:8080
          agentId: agent-dh

    - id: genome
      name: '@pi-investment/genome'
      config:
        # 插件默认值硬编码为 ~/.dsh-agent-dh/genome（旧 home，已删除），**不跟随 DSH_HOME**，
        # 所以这里的显式指定仍然必要（2026-09-14 合并后 DSH_HOME 已是 .dsh-data，
        # 但插件不读它 —— 不能因为目录结构收敛了就删掉这行）。
        genomeDir: /Users/yunpeng/pi-investment/agent-dh/.dsh-data/genome

    - id: learning
      name: '@pi-investment/learning'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: quantsys-v2-manager
      name: '@pi-investment/quantsys-v2-manager'
      config:
        projectRoot: /Users/yunpeng/pi-investment/quantsys-v2
        port: 5001
        healthCheckUrl: http://localhost:5001/api/health
        startupScript: adapters/inbound/fastapi_app/main.py
        activateScript: activate-py313.sh
        logFile: logs/launchd-stdout.log

    - id: agent-os-manager
      name: '@pi-investment/agent-os-manager'
      config:
        projectRoot: /Users/yunpeng/pi-investment/agent-os
        port: 8080
        healthCheckUrl: http://localhost:8080/health
        startCommand: ./bin/agent-os serve
        logDir: logs

    - id: evolver
      name: '@pi-investment/evolver'
      config:
        quantsysV2:
          baseURL: http://localhost:5001
        observeDays: 5

    - id: lifecycle
      name: '@pi-investment/lifecycle'
      config:
        repoRoot: /Users/yunpeng/pi-investment
        agentDhRoot: /Users/yunpeng/pi-investment/agent-dh
        # 2026-09-15 修复：原为 ~/.dsh/profiles/investment（已废弃空目录），
        # 迁移后正确路径 = profileDir/agents.json 与 profileDir/state 所在处
        profileDir: /Users/yunpeng/pi-investment/agent-dh/.dsh-data/profiles/agent-dh
        # 必须显式配：startScript 缺省 = profileDir/start.sh，而新 profileDir 下无该脚本
        startScript: /Users/yunpeng/pi-investment/agent-dh/scripts/start.sh
        port: 13080
        agentId: investor
        maxRestartsPerHour: 10

    - id: notification
      name: '@pi-investment/notification'
      config:
        agentOS:
          baseURL: http://localhost:8080
          agentId: agent-dh
        # 降级兜底 webhook（方案 C：主路径 Agent OS API 失败/全挂时直发飞书；'*' 为所有渠道共用）
        feishuWebhooks:
          '*': https://open.feishu.cn/open-apis/bot/v2/hook/b24be3a5-35fc-4142-90c2-3a3933172829

