# @pi-investment/bundle-evolution —— PI Investment「学习与进化」业务 bundle
# 2026-09-22（REQ-260922133113-ebc5）：按业务域拆分的 DSH 标准 bundle
# （package.json 的 dsh.bundle.patch 指向本文件）。插件页显示为「学习与进化」卡，
# 每行可在 GUI 单独开关（开关 = 往用户层 cordis.patch.yml 写同 id 覆盖行）。
# 新增属于本域的插件：行加进本文件；跨域归属调整：整行（含注释）搬到对应 bundle。
- insert:
    - id: memory
      name: '@pi-investment/memory'
      config:
        quantsysV2:
          baseURL: http://localhost:5001
        agentOS:
          baseURL: http://localhost:8080
          agentId: agent-dh

    - id: learning
      name: '@pi-investment/learning'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: evolution
      name: '@pi-investment/evolution'
      config:
        quantsysV2:
          baseURL: http://localhost:5001

    - id: evolver
      name: '@pi-investment/evolver'
      config:
        quantsysV2:
          baseURL: http://localhost:5001
        observeDays: 5

    - id: genome
      name: '@pi-investment/genome'
      config:
        # 插件默认值硬编码为 ~/.dsh-agent-dh/genome（旧 home，已删除），**不跟随 DSH_HOME**，
        # 所以这里的显式指定仍然必要（2026-09-14 合并后 DSH_HOME 已是 .dsh-data，
        # 但插件不读它 —— 不能因为目录结构收敛了就删掉这行）。
        genomeDir: /Users/yunpeng/pi-investment/agent-dh/.dsh-data/genome

    - id: lifecycle
      name: '@pi-investment/lifecycle'
      config:
        repoRoot: /Users/yunpeng/pi-investment
        agentDhRoot: /Users/yunpeng/pi-investment/agent-dh
        # 2026-09-15 修复：原为 ~/.dsh/profiles/investment（已废弃空目录），
        # 迁移后正确路径 = profileDir/agents.json 与 profileDir/state 所在处
        profileDir: /Users/yunpeng/pi-investment/agent-dh/.dsh-data/profiles/agent-dh
        # 必须显式配：startScript 缺省 = profileDir/start.sh，而新 profileDir 下无该脚本
        startScript: /Users/yunpeng/pi-investment/agent-dh/scripts/start.sh
        port: 13080
        agentId: investor
        maxRestartsPerHour: 10

    # 自主进化看板（host /dashboard/api/genome + client 视图：段状态/候选/gate 谱系）
    - id: dashboard-genome
      name: '@pi-investment/dashboard-genome'
      config: {}
