# @pi-investment/bundle-pmboard —— PI Investment「项目看板」单插件 bundle
# dsh-pmboard 需求流水线页面插件（host: reqboard JSON+SSE API 与立项/拆分/验收工具；client: GUI 看板视图）。
# 独立成 bundle 的原因：插件管理页只认 bundle 层，单插件 bundle = 插件页一张独立卡、可单独开关。
- insert:
    - id: dsh-pmboard
      name: 'dsh-pmboard'
      config:
        # REQ-260922012924-2e29 FR-3：开启节点压缩（D1 第二步；G0 门在需求文档未落盘时仍会 skip(doc_not_ready) 保护立项上下文）。回滚：改回 false + 重启。
        nodeIsolation: true
