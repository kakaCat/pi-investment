# Agent-DH: PI Investment Agent
# 基于 DSH 框架的投资分析 Agent

# ========== DSH 核心插件 ==========

# 设置管理
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# 凭证管理（从环境变量读取 DEEPSEEK_API_KEY）
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# DeepSeek LLM 适配器
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000

# 子进程运行时
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# ========== Agent-DH 投资插件 ==========

# 投资数据工具（行情、K线、财务、股票池、策略）
- id: investment
  name: '@pi-investment/investment'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 交易工具（账户、持仓）
- id: trading
  name: '@pi-investment/trading'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 智能工具（进化状态、盯盘）
- id: intelligence
  name: '@pi-investment/intelligence'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 竞争分析工具
- id: competition
  name: '@pi-investment/competition'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 市场数据工具
- id: market
  name: '@pi-investment/market'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 风险管理工具
- id: risk
  name: '@pi-investment/risk'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 策略管理工具
- id: strategy
  name: '@pi-investment/strategy'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 因子分析工具
- id: factor
  name: '@pi-investment/factor'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 数据管理工具
- id: data-manager
  name: '@pi-investment/data-manager'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 记忆系统
- id: memory
  name: '@pi-investment/memory'
  config:
    quantsysV2:
      baseURL: http://localhost:5001
    agentOS:
      baseURL: http://localhost:8080
      agentId: agent-dh

# 进化系统
- id: evolution
  name: '@pi-investment/evolution'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# 调度系统
- id: scheduler
  name: '@pi-investment/scheduler'
  config:
    agentOS:
      baseURL: http://localhost:8080
      agentId: agent-dh

# 基因组管理
# genomeDir 的插件默认值是硬编码的 ~/.dsh-agent-dh/genome（旧 home），不会跟随
# DSH_HOME，所以必须显式指定。2026-09-13 DSH_HOME 迁入项目内 .dsh-home 后，
# 基因组随数据落到 .dsh-data/genome。
- id: genome
  name: '@pi-investment/genome'
  config:
    genomeDir: /Users/yunpeng/pi-investment/agent-dh/.dsh-data/genome

# 学习系统
- id: learning
  name: '@pi-investment/learning'
  config:
    quantsysV2:
      baseURL: http://localhost:5001

# QuantSys-v2 管理器
- id: quantsys-v2-manager
  name: '@pi-investment/quantsys-v2-manager'
  config:
    projectRoot: /Users/yunpeng/pi-investment/quantsys-v2
    port: 5001
    healthCheckUrl: http://localhost:5001/api/health
    startupScript: adapters/inbound/fastapi_app/main.py
    activateScript: activate-py313.sh
    logFile: logs/launchd-stdout.log

# Agent OS 管理器
- id: agent-os-manager
  name: '@pi-investment/agent-os-manager'
  config:
    projectRoot: /Users/yunpeng/pi-investment/agent-os
    port: 8080
    healthCheckUrl: http://localhost:8080/health
    startCommand: ./bin/agent-os serve
    logDir: logs

# 进化器（观察和优化参数）
- id: evolver
  name: '@pi-investment/evolver'
  config:
    quantsysV2:
      baseURL: http://localhost:5001
    observeDays: 5

# 通知系统
- id: notification
  name: '@pi-investment/notification'
  config:
    agentOS:
      baseURL: http://localhost:8080
      agentId: agent-dh
    # 降级兜底 webhook（方案 C：主路径 Agent OS API 失败/全挂时直发飞书；'*' 为所有渠道共用）
    feishuWebhooks:
      '*': https://open.feishu.cn/open-apis/bot/v2/hook/b24be3a5-35fc-4142-90c2-3a3933172829

# ========== Agent 配置 ==========

# Agent 循环驱动 + 预创建 investor Agent
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: investor
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

# 系统提示词
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''
    # persona 内容已迁移至 genome 插件管理的基因组段落
    # constitution.md（宪法层，锁定） + principles.md（决策原则，可进化）
