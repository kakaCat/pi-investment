# Agent-DH Investment Profile Patch
# 投资分析 Agent 配置 —— 加载 PI Investment 插件

# ========== Agent Preset ==========
# 2026-09-12: 启用 agent-presets 并指向自建 investment preset。
# 内置 standard 组含 delegation（subagent/workflow/ralph），会因 host 层缺少
# modelSelectionSettings 而整体挂载失败；investment preset 是 standard 去掉
# delegation 组的副本（config/agent-presets/investment/，start.sh 会拷入 DSH_HOME）。
- id: agent-presets
  disabled: false
  config:
    default: investment

# ========== 设置文档：唯一一份 ==========
# 不再配 config.path —— 让 `@deepseek-ai/dsh-settings-file` 用它的缺省解析
# （resolveSpec: `config.path ?? join(resolveDshHome(config.dshHome), 'settings.yaml')`）。
# 2026-09-14 合并后 DSH_HOME 就是数据目录（.dsh-data），缺省即落在唯一那份上，
# 写绝对路径覆盖反而成了"同一个位置写两遍"。
#
# 这中间踩过的坑（保留备查，别再退回链接方案）：该插件写盘走 writeFileAtomic（临时文件 +
# rename），**rename 会把符号链接替换成普通文件** —— 一次 UI 改设置（例如换模型）之后
# $DSH_HOME/settings.yaml 就变成第二份真身，此后 UI 的写入落在它身上，而下一次启动的
# `ln -sf` 又把它静默覆盖，两份文档互相打架且全程无报错。
# 结论：这类"插件按 $DSH_HOME/<名> 取数的单文件状态"一律不要用链接去凑
# （dsh-reqboard.json / .credentials.yaml / pet.json 同病，见 scripts/start.sh 的合并说明）。

# ========== 禁用有 bug 的插件 ==========
# DSH 0.1.1-rc.2 版本中 tool-subagent-report 和 api-gateway 插件有 API 不兼容问题
- id: tool-subagent-report
  disabled: true
- id: api-gateway
  disabled: true

# DSH 0.1.2-alpha.5 版本中 subagent 和 session-controller 插件有导出缺失问题
