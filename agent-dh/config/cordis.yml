# Agent-DH Investment Profile Patch
# 投资分析 Agent 配置 —— 加载 PI Investment 插件

# ========== Agent Preset ==========
# 2026-09-12: 启用 agent-presets 并指向自建 investment preset。
# 内置 standard 组含 delegation（subagent/workflow/ralph），会因 host 层缺少
# modelSelectionSettings 而整体挂载失败；investment preset 是 standard 去掉
# delegation 组的副本（config/agent-presets/investment/，start.sh 会拷入 DSH_HOME）。
- id: agent-presets
  disabled: false
  config:
    default: investment

# ========== 禁用有 bug 的插件 ==========
# DSH 0.1.1-rc.2 版本中 tool-subagent-report 和 api-gateway 插件有 API 不兼容问题
- id: tool-subagent-report
  disabled: true
- id: api-gateway
  disabled: true

# DSH 0.1.2-alpha.5 版本中 subagent 和 session-controller 插件有导出缺失问题
# 2026-09-08: 0.1.2-rc.1 版本已修复，重新启用 session-controller
# 2026-09-12: 必须启用 model-selection-settings（host 层服务），否则 agent-presets
#             加载 delegation 组时会失败（即使 tool 本身被禁用，preset 仍需 host 依赖存在）
- id: subagent-model-selection-settings
  disabled: false
# - id: session-controller
#   disabled: true

# 2026-09-08: 禁用整个 delegation 组 + 组内每个子项
- id: delegation
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true

# DSH 0.1.2-rc.1 版本中 @linxin666/* 和第三方 UI 插件与 dsh-settings API 不兼容
# 错误：The requested module '@deepseek-ai/dsh-settings' does not provide an export named 'settingsNamespace'
- id: web-ui-settings
  disabled: true
- id: web-ui-market
  disabled: true
- id: web-ui-task-board
  disabled: true
- id: web-ui-remote-web-ui
  disabled: true
- id: web-ui-pet
  disabled: true
- id: web-ui-ssh
  disabled: true
- id: web-ui-describe-image
  disabled: true
- id: web-ui-desktop-launcher
  disabled: true
- id: web-ui-doctor
  disabled: true
- id: web-ui-skin-center
  disabled: true
- id: web-ui-better-sidebar
  disabled: true

