# ========== 投资插件 ==========
# 2026-09-22（REQ-260922133113-ebc5）：投资插件行已整体迁入伞 bundle
#   packages/bundle/dsh-bundle/cordis.patch.yml（@pi-investment/dsh-bundle），
# 经 profile 清单 dsh.profile.bundles 加载，不再以裸 insert 出现在本文件（用户层）。
# 原因：DSH 插件管理页只认 bundle 层；裸 insert 行不可见且标 unaddressable。
# 本文件（用户层）只保留对 bundle 行的**覆盖**（disabled 开关、config 微调）。
# 新增插件 → 加进伞包 patch；GUI 开关某行 → 管理器自动在本文件写同 id 覆盖行。

