# 2026-09-12: 必须启用 model-selection-settings（host 层服务），否则 agent-presets
#             加载 delegation 组时会失败（即使 tool 本身被禁用，preset 仍需 host 依赖存在）
- id: subagent-model-selection-settings
  disabled: false
