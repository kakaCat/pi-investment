# ========== Skill 自定义目录 ==========
# 2026-09-03：skill 真身统一放 agent-dh/skills（工程归属），此处注册为自定义 skill 根。
# 2026-09-05 更正：本文件为主实例(:3080)配置模板，非 :13080 运行配置！
# 2026-09-13 更新：:13080 的 DSH_HOME 已迁入项目内。
# 2026-09-14 更新：.dsh-home 已并入 .dsh-data（DSH_HOME 即数据目录，见 scripts/start.sh），
# 现役真身见 agent-dh/.dsh-data/profiles/agent-dh/cordis.patch.yml
# （本文件是它的源：start.sh 的 _ensure_from 只在目标缺失时拷贝）。
# 旧路径 ~/.dsh-agent-dh/profiles/investment/ 已是历史副本，仅作回滚用。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - /Users/yunpeng/pi-investment/agent-dh/skills

# ========== LLM 配置 ==========
- id: llm-deepseek
  # 0.2.1：该行真身已改为 @deepseek-ai/dsh-llm-deepseek-api-key；只按 id 覆盖，不写 name。
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000

# ========== 系统提示词 ==========
- id: system-prompt
  config:
    # dsh 0.1.5 起 persona 拆成 personaPrefix（主体，首段）/ personaSuffix（尾段）；
    # 旧的单键 persona 已不再被 schema 接受。两侧均留空：persona 内容已迁移至
    # genome 插件管理的基因组段落
    personaPrefix: ''
    personaSuffix: ''
    # constitution.md（宪法层，锁定） + principles.md（决策原则，可进化）

# ========== Agent 配置 ==========
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: investor
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
