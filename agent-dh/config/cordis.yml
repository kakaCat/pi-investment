# ========== Skill 自定义目录 ==========
# 2026-09-03：skill 真身统一放 agent-dh/skills（工程归属），此处注册为自定义 skill 根。
# 2026-09-05 更正：本文件（~/.dsh）为主实例(:3080)配置，非 :13080 运行配置！
# :13080 investment profile 的 DSH_HOME=~/.dsh-agent-dh（start.sh 隔离），真身见
# ~/.dsh-agent-dh/profiles/investment/cordis.patch.yml（已在彼处注册 customSkillDirs）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - /Users/yunpeng/pi-investment/agent-dh/skills

# ========== LLM 配置 ==========
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000

# ========== 系统提示词 ==========
- id: system-prompt
  config:
    persona: ''
    # persona 内容已迁移至 genome 插件管理的基因组段落
    # constitution.md（宪法层，锁定） + principles.md（决策原则，可进化）

# ========== Agent 配置 ==========
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: investor
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()