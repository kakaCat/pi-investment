      implements: 编写 card-renderer.ts，实现 renderCard 函数，根据任务数据渲染 7 个视觉元素：ID、类型徽标、端侧徽标、标题、状态底色、父卡标识（左侧蓝条）、ready 绿点。卡片尺寸 208×72px，支持传入位置坐标。接收 FR-2。
      serves: []
      depends_on:
        - t-efa03b
      phase: implement
      side: frontend
    - id: t-4256bf
      title: 实现 DAG 布局引擎
      implements: 编写 dag-layout.ts，实现 calculateLayout 函数，消费 queue.json 的 layers 和 tasks 数据，支持纵向/横向两种布局方向。纵向：按层级从上到下，同层折行；横向：按层级从左到右，同层纵向堆叠。返回每个节点的 (x, y) 坐标和画布尺寸。接收 FR-3。
      serves: []
      depends_on:
        - t-2ad263
      phase: implement
      side: frontend
    - id: t-e4e9db
      title: 实现边线渲染器
      implements: 编写 edge-renderer.ts，实现 renderEdges 函数，根据任务状态给连线着色：from/to 都 done=绿色（rgba(52,199,89,.5)，1.3px）；默认=灰色（rgba(0,0,0,.17)，1.2px）；关键路径=蓝色（rgba(0,113,227,.75)，1.8px）。支持传入关键路径节点集合。接收 FR-4。
      serves: []
      depends_on:
        - t-4256bf
      phase: implement
      side: frontend
    - id: t-1f219b
      title: 实现关键路径算法
      implements: 编写 critical-path.ts，实现 findCriticalPath 函数，使用拓扑排序 + 动态规划计算 DAG 的最长路径。从入度为 0 的节点开始，计算到每个节点的最长路径长度，回溯得到关键路径节点集合。返回 Set<taskId>。接收 FR-6。
      serves: []
      depends_on:
        - t-4256bf
      phase: implement
      side: backend
    - id: t-73c392
      title: 实现悬停交互处理器
      implements: 编写 interaction.ts，实现 setupInteraction 函数，监听 canvas 的 mousemove 和 click 事件。悬停时高亮上游（橙色）和下游（蓝色）边线，未高亮元素 dimming（透明度 0.18/0.05），当前卡片加黑边框和阴影。点击钉住状态，再次点击或点击画布取消。接收 FR-5。
      serves: []
      depends_on:
        - t-e4e9db
      phase: implement
      side: frontend
    - id: t-d379c7
      title: 实现父卡子卡链进度条
      implements: 编写 progress-bar.ts，实现 renderProgressBar 函数，在父卡底部绘制 4 段进度条（dev/integrate/review/test），每段根据子卡状态着色：已完成=绿色、进行中=蓝色、待开始=灰色。显示进度文本 '已完成数/总数'。接收 FR-7。
