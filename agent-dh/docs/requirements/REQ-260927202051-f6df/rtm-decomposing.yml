outputs:
  tasks:
    - id: t-87f0da
      title: 定义队列类型与任务契约
      implements: "新建 packages/web/dsh-pmboard/src/domain/queue/QueueTypes.ts。导出 QUEUE_VERSION=1 与类型：QueueFile（version/requirement_id/schemaVersion/generated_at/updated_at?/tasks/edges/layers/ready）、QueueTask = TaskRecord & { layer: number }（从 src/shared/protocol.ts import TaskRecord，不重定义字段）、QueueEdge{from,to}、QueueLayer{layer,tasks}、ValidationIssue{rule,message,path?}、ValidationResult{passed,issues}。严禁裁剪 TaskRecord 字段——少一个字段就破坏读方只换数据源的最小回归路径。"
      serves: []
      depends_on: []
      phase: implement
      side: backend
    - id: t-0e7fac
      title: 实现 DAG 拓扑分层与派生视图
      implements: 新建 src/domain/queue/topology.ts，实现纯函数：computeLayers(tasks)（Kahn 入度分层；有环抛 Error 含 CIRCULAR）、computeEdges(tasks)（由 dependsOn 展开）、computeReady(tasks)（依赖全 done 且自身 todo 者入 ready）。computeReady 必须是唯一实现，写路径不得另写一份（否则 V-5 假就绪/漏就绪必现）。配 topology.test.ts 覆盖线性/菱形/多层/环/空/多 ready/依赖已 done 七种形状。
      serves: []
      depends_on:
        - t-87f0da
      phase: implement
      side: backend
    - id: t-394339
      title: 实现队列数据校验 V-1~V-6
      implements: 新建 src/domain/queue/validateQueue.ts，实现纯函数 validateQueueFile(file) → ValidationResult（不抛错，失败只填 issues）。逐条实现：V-1 必填字段完整性；V-2 tasks[].id 唯一；V-3 引用完整性（dependsOn/edges/layers/ready 的 id 均在 tasks 内，且 task.requirementId === queue.requirement_id 防跨档）；V-4 层级一致性；V-5 ready 双向一致性（假就绪与漏就绪）；V-6 无环性（复用 topology 环检测）。
      serves: []
      depends_on:
        - t-87f0da
      phase: implement
      side: backend
    - id: t-e96a0c
      title: 实现队列仓储与原子写入
      implements: 新建 src/repositories/QueueRepository.ts。load(requirementId)：读 docs/requirements/<REQ>/queue.json → JSON 解析 → validateQueueFile；不存在/解析失败/校验失败均返回 undefined（解析失败时隔离改名为 .corrupt-<ts> 并告警）。save(requirementId, file)：先 validateQueueFile，通过才调 adapters/JsonLedgerRepository.ts 已导出的 persistAtomic 原子写（temp+fsync+rename），失败抛 QUEUE_VALIDATION_FAILED 且不落盘。pathOf 返回队列文件路径。
      serves: []
      depends_on:
        - t-87f0da
